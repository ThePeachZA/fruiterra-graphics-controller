[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/protocol",
    "crates/server",
    "crates/app",
]
default-members = ["crates/app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Fruiterra"]
repository = "https://github.com/fruiterra/fruiterra-graphics-controller"

[workspace.dependencies]
# Internal crates — one-way dependency chain: core → protocol → server → app.
fgc-core = { path = "crates/core" }
fgc-protocol = { path = "crates/protocol" }
fgc-server = { path = "crates/server" }

# Shared third-party versions.
anyhow = "1.0"
base64 = "0.22"
directories = "6.0"
mime_guess = "2.0"
rust-embed = "8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.0"
thiserror = "2.0"
tokio = { version = "1.0", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "macros",
    "signal",
] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

axum = "0.8"

# UI: pinned to the last stable Dioxus 0.7 release.
dioxus = { version = "=0.7.10", features = ["desktop"] }
# Git-only crate. Pinned to a revision whose workspace targets Dioxus 0.7.x.
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9a758255ea26e2b20c8cecf4c1c946feb9e71da7", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
