<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <link rel="icon" href="data:,">
  <title>Map Select</title>
  <style>
    /* Critical document guard: contain overscanned FX/lattice layers during load so transient scrollbars never appear. */
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    @font-face {
      font-family: 'FGC Display Light';
      font-weight: 300;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-300.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display';
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-400.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display Medium';
      font-weight: 500;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-500.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display SemiBold';
      font-weight: 600;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-600.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display Black';
      font-weight: 900;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-900.woff2') format('woff2');
    }

    /* === NIGHT BROADCAST TOKENS ===
       Shared design tokens for the Fruiterra overlay refresh. Each overlay
       inlines this block, exactly as it inlines its own font faces. */
    :root {
      --fgc-canvas: transparent;

      --fgc-surface: #0b0d12;
      --fgc-surface-raised: #11151d;
      --fgc-surface-inverse: #eef2f8;
      --fgc-surface-muted: #151922;

      --fgc-line: #2a3140;
      --fgc-line-strong: #3a4356;
      --fgc-line-on-inverse: #0b0d12;

      --fgc-text: #eef2f8;
      --fgc-text-muted: #8d99ad;
      --fgc-text-faint: #6b7688;
      --fgc-text-inverse: #0b0d12;

      /* Tag fallbacks sit on fixed dark plates, so they stay light in every theme. */
      --fgc-tag-ink: #eef2f8;

      --fgc-accent: #ff7a1a;
      --fgc-accent-strong: #ff9346;
      --fgc-accent-soft: rgb(255 122 26 / 16%);
      --fgc-on-accent: #0b0d12;

      --fgc-success: #3ecf8e;
      --fgc-warning: #f5b84b;
      --fgc-danger: #ef5b5b;

      --fgc-space-1: 4px;
      --fgc-space-2: 8px;
      --fgc-space-3: 12px;
      --fgc-space-4: 16px;
      --fgc-radius-sm: 4px;
      --fgc-radius-md: 6px;
      --fgc-radius-lg: 10px;
      --fgc-radius-pill: 999px;
      --fgc-margin: 43px;

      --fgc-duration-micro: 120ms;
      --fgc-duration-state: 240ms;
      --fgc-duration-reveal: 480ms;
      --fgc-duration-scene: 900ms;
      --fgc-ease-out: cubic-bezier(0.22, 1, 0.36, 1);

      --anim-delay: 0.8s;
      --anim-duration: 0.5s;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'FGC Display', 'Apotek', sans-serif;
      background: transparent;
    }

    .overlay {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    /* === ANIMATIONS === */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(60px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeSlideDown {
      from {
        opacity: 0;
        transform: translateY(-40px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes cardReveal {
      from {
        opacity: 0;
        transform: translateY(80px) scaleX(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scaleX(1);
      }
    }

    @keyframes watermarkReveal {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes mapCardFocus {
      from { flex-grow: 1; }
      to { flex-grow: 1.8; }
    }

    @keyframes banReveal {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.78);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes winnerLogoReveal {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.6);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes footerReveal {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* === INITIAL HIDDEN STATES === */
    .map-select-title,
    .map-card,
    .watermark,
    .tournament-logo {
      opacity: 0;
    }

    /* === ANIMATION CLASSES === */
    .animate-title {
      animation: fadeSlideDown 1.2s cubic-bezier(0.3, 1, 0.4, 1) forwards;
      animation-delay: var(--anim-delay);
    }

    .animate-card {
      animation: cardReveal var(--anim-duration) var(--ease-out-expo) forwards;
      animation-delay: var(--card-delay, var(--anim-delay));
    }

    .map-card--current.animate-card {
      --current-grow: 1;
      animation:
        cardReveal var(--anim-duration) var(--ease-out-expo) forwards,
        mapCardFocus 760ms var(--ease-out-expo) forwards;
      animation-delay:
        var(--card-delay, var(--anim-delay)),
        var(--focus-delay, calc(var(--card-delay, var(--anim-delay)) + 160ms));
    }

    /* After the opening reveal, later data changes drive their own animations. */
    .map-card--settled .map-card__ban,
    .map-card--settled .map-card__text,
    .map-card--settled .map-card__logo--winner {
      animation: none !important;
      opacity: 1;
    }

    .map-card--settled .map-card__logo--winner {
      transform: translate(-50%, -50%);
    }

    .animate-watermark {
      animation: watermarkReveal 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: 3.5s;
    }

    .animate-logo {
      animation: fadeSlideUp var(--anim-duration) var(--ease-out-expo) forwards;
      animation-delay: calc(var(--anim-delay) + 0.8s);
    }

    .main-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 100px 200px;
    }

    /* === MAP SELECT TITLE === */
    .map-select-title {
      font-family: 'FGC Display Black', 'Apotek Black', sans-serif;
      font-size: 128px;
      color: var(--fgc-text);
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* === MAP CARDS CONTAINER === */
    .maps-container {
      display: flex;
      gap: 16px;
      justify-content: center;
      width: 100%;
    }

    /* === MAP CARD === */
    .map-card {
      height: 600px;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--fgc-surface-raised);
      position: relative;
      clip-path: inset(0 round 8px);
      flex: 1 1 0;
      min-width: 0;
    }

    .map-card--current {
      flex: var(--current-grow, 1.8) 1 0;
    }

    /* === MAP CARD LOGO === */
    .map-card__logo {
      position: absolute;
      top: calc(50% - 52px);
      left: 50%;
      transform: translate(-50%, -50%);
      width: 112px;
      height: 112px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      z-index: 3;
    }

    .map-card__logo--hidden {
      display: none;
    }

    .map-card__logo--placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: linear-gradient(to bottom, rgb(11 13 18 / 86%), rgb(11 13 18 / 64%));
      border: 1px solid rgb(238 242 248 / 18%);
      border-radius: 4px;
      font-family: 'FGC Display SemiBold', 'Apotek Semibold', sans-serif;
      font-size: 26px;
      letter-spacing: 0.08em;
      line-height: 1;
      text-align: center;
      color: var(--fgc-tag-ink);
      text-shadow: 0 2px 10px rgb(0 0 0 / 70%);
      overflow-wrap: anywhere;
    }

    .map-card__logo--winner {
      isolation: isolate;
      filter:
        drop-shadow(0 6px 18px rgba(0, 0, 0, 0.65))
        drop-shadow(0 0 16px var(--winner-color, var(--fgc-accent)));
      animation: winnerLogoReveal 620ms var(--ease-out-expo) both;
      animation-delay: calc(var(--card-delay, var(--anim-delay)) + 520ms);
    }

    .map-card__logo--winner::before {
      content: '';
      position: absolute;
      inset: -20px;
      z-index: -1;
      border-radius: 50%;
      background: radial-gradient(circle, var(--winner-color, var(--fgc-accent)), transparent 70%);
      opacity: 0.28;
      filter: blur(12px);
      pointer-events: none;
    }

    /* === MAP CARD IMAGE === */
    .map-card__image {
      width: 100%;
      flex: 1;
      /* Flex rounding can leave a one-pixel gutter at either card edge. */
      margin-inline: -1px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    .map-card__image::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.28) 48%,
        rgba(0, 0, 0, 0.78) 100%
      );
      pointer-events: none;
    }

    .map-card__image--complete {
      filter: brightness(0.52) saturate(0.45);
    }

    .map-card__image--placeholder {
      background: var(--fgc-surface-muted);
    }

    /* A dark curtain covers map swaps so no empty surface can flash through. */
    .map-card__swap {
      position: absolute;
      inset: -1px;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 0.28) 48%,
          rgba(0, 0, 0, 0.78) 100%
        ),
        var(--fgc-surface-muted);
    }

    /* === MAP CARD BANS === */
    .map-card__visual {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
    }

    .map-card__visual--complete::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(
        circle at 50% 50%,
        var(--winner-color, var(--fgc-accent)),
        transparent 68%
      );
      opacity: 0.13;
      pointer-events: none;
    }

    .map-card__bans {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: flex;
      gap: 18px;
      z-index: 4;
      pointer-events: none;
    }

    .map-card__ban {
      position: relative;
      width: 52px;
      height: 60px;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.55));
      animation: banReveal 420ms var(--ease-out-expo) both;
      animation-delay: calc(var(--card-delay, var(--anim-delay)) + var(--ban-delay, 0.38s));
    }

    .map-card__ban::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--fgc-accent);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }

    .map-card__ban img {
      position: absolute;
      inset: 2px;
      display: block;
      width: calc(100% - 4px);
      height: calc(100% - 4px);
      object-fit: contain;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }

    .map-card__ban-number {
      position: absolute;
      top: -9px;
      right: -8px;
      width: 26px;
      height: 30px;
      background: var(--fgc-accent);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.55));
    }

    .map-card__ban-number::before {
      content: '';
      position: absolute;
      inset: 2px;
      background: var(--fgc-surface);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }

    .map-card__ban-number span {
      position: relative;
      z-index: 1;
      font-family: 'FGC Display SemiBold', 'Apotek Semibold', sans-serif;
      font-size: 11px;
      line-height: 1;
      color: var(--fgc-accent);
    }

    /* === MAP CARD TEXT === */
    .map-card__text {
      width: 100%;
      height: 112px;
      container-type: inline-size;
      background: var(--fgc-surface-raised);
      border-top: 1px solid var(--fgc-line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 8px 16px;
      overflow: hidden;
      animation: footerReveal 420ms var(--ease-out-expo) both;
      animation-delay: calc(var(--card-delay, var(--anim-delay)) + 260ms);
    }

    .map-card__meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 20px;
    }

    .map-card__type {
      font-family: 'FGC Display Medium', 'Apotek Medium', sans-serif;
      font-size: 14px;
      color: var(--fgc-accent);
      text-transform: uppercase;
      text-align: center;
      line-height: 1;
    }

    .map-card__name {
      width: 100%;
      font-family: 'FGC Display SemiBold', 'Apotek Semibold', sans-serif;
      font-size: clamp(16px, 8cqw, 24px);
      color: var(--fgc-text);
      text-transform: uppercase;
      text-align: center;
      line-height: 1.1;
      white-space: normal;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .map-card__chosen-by {
      width: 100%;
      font-family: 'FGC Display', 'Apotek', sans-serif;
      font-size: 12px;
      color: var(--fgc-text-muted);
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .map-card__chosen-by--hidden {
      display: none;
    }

    .map-card__text-ghost {
      position: absolute;
      box-sizing: border-box;
      z-index: 4;
      pointer-events: none;
      animation: none !important;
    }

    /* === WATERMARK === */
    .watermark {
      height: 48px;
      min-width: 366px;
      background: var(--fgc-surface-inverse);
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0 40px;
      flex-shrink: 0;
      margin-top: 30px;
    }

    .watermark__text {
      font-family: 'FGC Display Medium', 'Apotek Medium', sans-serif;
      font-size: 28px;
      color: var(--fgc-text-inverse);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* === TOURNAMENT LOGO === */
    .tournament-logo {
      position: absolute;
      top: 13px;
      right: 40px;
      height: 48px;
      width: auto;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .tournament-logo.icon-hidden {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-title,
      .animate-card,
      .animate-watermark,
      .animate-logo,
      .map-card__logo--winner,
      .map-card__ban,
      .map-card__text {
        animation: none !important;
        opacity: 1;
        transform: none;
      }

      .map-card__logo--winner {
        transform: translate(-50%, -50%);
      }

      .map-card--current.animate-card {
        --current-grow: 1.8;
      }
    }
  </style>
  <!-- === FGC CANONICAL FX START === -->
  <style>
    :root {
      --fgc-hex-mask: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' width='56' height='100' viewBox='0 0 56 100'%3E%3Cpath d='M28 66L0 50L0 16L28 0L56 16L56 50L28 66L28 100L0 84L0 50L28 34L56 50L56 84L28 100' fill='none' stroke='%23ffffff' stroke-width='1'/%3E%3C/svg%3E");
    }

    /* The mask repeats every 180x322 px, so exactly one tile of travel lands
       on an identical frame. Keeping the colour uniform is part of that seam:
       a non-repeating gradient would move even though the lattice re-aligned. */
    @keyframes fgcCanonicalFxDrift {
      from { transform: translate3d(0, -322px, 0); }
      to { transform: translate3d(180px, 0, 0); }
    }

    /* The FX siblings come first; the existing roots stay above them without
       changing their geometry, colours or layout. */
    .overlay {
      z-index: 1;
    }

    /* Opaque mode is one plain plate taken from the theme. The lattice stays
       on top of it, so both modes carry the hexagon display. */
    .fgc-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      display: none;
      background-color: var(--fgc-surface);
    }

    .fgc-fx {
      position: absolute;
      /* More than one tile on every side, including the travel at both ends. */
      inset: -360px;
      z-index: 0;
      pointer-events: none;
      background-color: var(--fgc-line-strong);
      opacity: 0.16;
      -webkit-mask-image: var(--fgc-hex-mask);
      mask-image: var(--fgc-hex-mask);
      -webkit-mask-size: 180px 322px;
      mask-size: 180px 322px;
      -webkit-mask-repeat: repeat;
      mask-repeat: repeat;
      -webkit-mask-position: center;
      mask-position: center;
      transform: translate3d(0, -322px, 0);
      animation: fgcCanonicalFxDrift 72s linear infinite;
      /* Only this compositor drift changes every frame; the mask never repaints. */
      will-change: transform;
    }

    html[data-fx="off"] .fgc-fx {
      display: none;
    }

    html[data-bg="opaque"] .fgc-bg {
      display: block;
    }


    /* Reduced motion freezes the drift but keeps the static lattice. */
    @media (prefers-reduced-motion: reduce) {
      .fgc-fx {
        animation: none;
      }
    }
  </style>
  <script>
    (() => {
      const query = new URLSearchParams(location.search);
      const root = document.documentElement;

      const requestedFx = query.get('fx');
      if (requestedFx === 'on' || requestedFx === 'off') {
        root.dataset.fx = requestedFx;
      } else if (root.dataset.fx !== 'off') {
        root.dataset.fx = 'on';
      }

      // Opaque is the default; transparent turns it back on. The short aliases
      // read naturally in a Browser Source URL. A document-level data-bg
      // attribute lets a host page override that default.
      const requestedBg = query.get('bg');
      const bgMode =
        requestedBg === 'off' ? 'opaque' :
        requestedBg === 'on' ? 'transparent' :
        requestedBg;
      if (bgMode === 'opaque' || bgMode === 'transparent') {
        root.dataset.bg = bgMode;
      } else if (root.dataset.bg !== 'opaque' && root.dataset.bg !== 'transparent') {
        root.dataset.bg = 'opaque';
      }

      // A cached section message lets the app switch every connected source
      // without an OBS refresh. It also arrives inside the keyed init frame
      // when a source refreshes, so the URL is only the starting state.
      window.fgcUpdateBackground = (data) => {
        const payload = data && typeof data === 'object' ? (data.data || data) : null;
        const section = payload && payload.background && typeof payload.background === 'object'
          ? payload.background
          : null;
        const candidate = section || payload;
        const opaque = candidate && typeof candidate.opaque === 'boolean' ? candidate.opaque : null;
        if (opaque !== null) {
          root.dataset.bg = opaque ? 'opaque' : 'transparent';
        }
      };
    })();
  </script>
  <!-- === FGC CANONICAL FX END === -->
</head>
  <body>
  <div class="fgc-bg" aria-hidden="true"></div>
  <div class="fgc-fx" aria-hidden="true"></div>
  <div class="overlay" id="overlay">
    <!-- Main flex container -->
    <div class="main-container">
      <!-- Title -->
      <div class="map-select-title" id="map-select-title">MAP SELECT</div>

      <!-- Maps Container -->
      <div class="maps-container" id="maps-container">
        <!-- Maps will be dynamically created -->
      </div>

      <!-- Watermark (Powered by ThePeachZA) -->
      <div class="watermark" id="watermark">
        <span class="watermark__text">Powered by ThePeachZA</span>
      </div>
    </div>

    <!-- Tournament Logo (outside flex, positioned absolutely) -->
    <div class="tournament-logo" id="tournament-logo"></div>
  </div>

  <script>
    // Escape user-supplied text before interpolating it into innerHTML.
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      })[character]);
    }

    const el = {
      overlay: document.getElementById('overlay'),
      title: document.getElementById('map-select-title'),
      mapsContainer: document.getElementById('maps-container'),
      watermark: document.getElementById('watermark'),
      tournamentLogo: document.getElementById('tournament-logo')
    };

    let heroIcons = {};
    let heroBans = [];
    let currentMapIndex = -1;
    let loserPicks = true;
    let animationsTriggered = false;
    let openingSettled = false;
    const TIEBREAKER_INDEX = 7;
    const RESIZE_DURATION = 720;
    const CONTENT_IN_DURATION = 420;
    const CURTAIN_FADE_DURATION = 360;
    const LOGO_REVEAL_DURATION = 720;
    const FOCUS_EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';

    // Reconciliation compares each message with the last rendered snapshot.
    // Only the fields that actually changed are animated after the opening reveal.
    let renderedMaps = null;
    let renderedHeroBans = null;
    let renderedHeroIcons = null;
    let renderedTeamA = null;
    let renderedTeamB = null;
    let renderedLoserPicks = true;
    let renderedCurrentIndex = -1;

    function snapshot(value) {
      return value === undefined ? undefined : JSON.parse(JSON.stringify(value));
    }

    function sameValue(left, right) {
      return JSON.stringify(left) === JSON.stringify(right);
    }

    function emptyMap() {
      return {
        name: '',
        type: '',
        scoreA: 0,
        scoreB: 0,
        mapImageUrl: '',
        completed: false,
        chosenByName: null
      };
    }

    function prefersReducedMotion() {
      return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    // The projected maps array is the source of truth. The legacy tiebreaker
    // only adds a card when the old seven-map boundary is selected as current.
    function projectedMapCardCount(maps) {
      const isLegacyTiebreaker =
        maps.length === TIEBREAKER_INDEX && currentMapIndex === TIEBREAKER_INDEX;
      return isLegacyTiebreaker ? TIEBREAKER_INDEX + 1 : maps.length;
    }

    function triggerAnimations() {
      el.title.classList.add('animate-title');
      el.watermark.classList.add('animate-watermark');
      el.tournamentLogo.classList.add('animate-logo');

      const cards = el.mapsContainer.querySelectorAll('.map-card');
      cards.forEach((card, i) => {
        card.style.setProperty('--card-delay', `calc(var(--anim-delay) + ${0.1 + i * 0.1}s)`);
        card.classList.add('animate-card');
      });
    }

    function resetAnimations() {
      el.title.classList.remove('animate-title');
      el.watermark.classList.remove('animate-watermark');
      el.tournamentLogo.classList.remove('animate-logo');

      const cards = el.mapsContainer.querySelectorAll('.map-card');
      cards.forEach(card => {
        card.classList.remove('animate-card');
        card.style.removeProperty('--card-delay');
      });
    }

    // The opening reveal uses CSS `forwards` fills. Cancel them once live
    // updates begin so targeted WAAPI animations own the final state.
    function settleInitialAnimations() {
      el.mapsContainer.querySelectorAll('.map-card').forEach(card => {
        card.getAnimations().forEach(animation => animation.cancel());
        card.classList.remove('animate-card');
        card.classList.add('map-card--settled');
        card.style.opacity = '1';
        card.style.transform = '';
        card.style.removeProperty('--card-delay');
        card.style.removeProperty('--focus-delay');
        if (card.classList.contains('map-card--current')) {
          card.style.setProperty('--current-grow', '1.8');
        }
        card.querySelectorAll('.map-card__logo, .map-card__ban, .map-card__text').forEach(child => {
          child.getAnimations().forEach(animation => animation.cancel());
        });
      });
    }

    function cancelCardSwaps(card) {
      if (card._swapAnimations) {
        card._swapAnimations.forEach(animation => animation.cancel());
      }
      card._swapAnimations = [];
      const swapLayer = card.querySelector('.map-card__swap');
      if (swapLayer) swapLayer.style.removeProperty('opacity');
      card.querySelectorAll('.map-card__text-ghost').forEach((ghost) => ghost.remove());
    }

    function animateContentSwap(card, targets, applyUpdate) {
      cancelCardSwaps(card);
      const swapLayer = card.querySelector('.map-card__swap');
      if (prefersReducedMotion() || !swapLayer) {
        applyUpdate();
        return;
      }

      const token = String((Number(card.dataset.swap || '0') + 1));
      card.dataset.swap = token;

      const text = card.querySelector('.map-card__text');
      let textGhost = null;
      if (text) {
        const textBox = text.getBoundingClientRect();
        const cardBox = card.getBoundingClientRect();
        textGhost = text.cloneNode(true);
        textGhost.classList.add('map-card__text-ghost');
        textGhost.style.left = `${textBox.left - cardBox.left}px`;
        textGhost.style.top = `${textBox.top - cardBox.top}px`;
        textGhost.style.width = `${textBox.width}px`;
        textGhost.style.height = `${textBox.height}px`;
        card.appendChild(textGhost);
      }

      // Cover first, swap once, then reveal. A separate fade-out made the
      // change read as two animations.
      swapLayer.style.opacity = '1';
      applyUpdate();

      // Art leads; the old text fades out as type and name reveal together.
      const inAnimations = targets.map((target, index) =>
        target.animate(
          [
            { opacity: 0, transform: 'translateY(6px)' },
            { opacity: 1, transform: 'translateY(0)' }
          ],
          {
            duration: CONTENT_IN_DURATION,
            delay: index === 0 ? 0 : 60,
            easing: FOCUS_EASE,
            fill: 'forwards'
          }
        )
      );
      inAnimations.push(
        swapLayer.animate(
          [{ opacity: 1 }, { opacity: 0 }],
          { duration: CURTAIN_FADE_DURATION, easing: FOCUS_EASE, fill: 'forwards' }
        )
      );
      if (textGhost) {
        inAnimations.push(
          textGhost.animate(
            [{ opacity: 1 }, { opacity: 0 }],
            { duration: CONTENT_IN_DURATION, delay: 60, easing: FOCUS_EASE, fill: 'forwards' }
          )
        );
      }
      card._swapAnimations = inAnimations;

      Promise.all(inAnimations.map(animation => animation.finished.catch(() => {}))).then(() => {
        if (card.dataset.swap !== token) return;
        swapLayer.style.removeProperty('opacity');
        if (textGhost) textGhost.remove();
        inAnimations.forEach(animation => animation.cancel());
        card._swapAnimations = [];
      });
    }

    function animateCardWidth(card, from, to, cleanup) {
      if (prefersReducedMotion()) {
        if (cleanup) cleanup();
        return;
      }
      const animation = card.animate(
        [{ flexGrow: String(from) }, { flexGrow: String(to) }],
        { duration: RESIZE_DURATION, easing: FOCUS_EASE }
      );
      const finish = () => {
        if (cleanup) cleanup();
        animation.cancel();
      };
      animation.finished.then(finish, finish);
    }

    function animateLogoIn(logo, index) {
      if (prefersReducedMotion()) return;
      logo.getAnimations().forEach(animation => animation.cancel());
      const animation = logo.animate(
        [
          { opacity: 0, transform: 'translate(-50%, -50%) scale(0.6)' },
          { opacity: 1, transform: 'translate(-50%, -50%) scale(1)' }
        ],
        {
          duration: LOGO_REVEAL_DURATION,
          delay: index * 40,
          easing: FOCUS_EASE,
          fill: 'both'
        }
      );
      animation.finished.then(() => animation.cancel(), () => animation.cancel());
    }

    function safeHexColor(value, fallback) {
      const match = /^#?([0-9a-fA-F]{6})$/.exec(String(value || '').trim());
      return match ? `#${match[1]}` : fallback;
    }

    function teamLogoPlaceholderText(team) {
      if (!team) return '';
      const tag = typeof team.tag === 'string' ? team.tag.trim() : '';
      if (tag) return tag;
      const name = typeof team.name === 'string' ? team.name.trim() : '';
      if (!name) return '';
      const parts = name.split(/\s+/).filter(Boolean);
      if (parts.length === 1) return Array.from(parts[0]).slice(0, 2).join('').toUpperCase();
      return parts.slice(0, 2).map((part) => Array.from(part)[0].toUpperCase()).join('');
    }

    // The banned heroes are ordered by who banned first, so the number on the
    // order chip matches the order the bans were made in.
    function orderedBans(bans) {
      if (!bans) return [];
      const teamA = Array.isArray(bans.teamA) ? bans.teamA : [];
      const teamB = Array.isArray(bans.teamB) ? bans.teamB : [];
      return bans.firstBanTeam === 'B' ? [...teamB, ...teamA] : [...teamA, ...teamB];
    }

    function createBanStrip(bans) {
      const names = orderedBans(bans);
      if (!names.length) return '';
      const items = names
        .map((heroName, index) => {
          const iconUrl = heroIcons[heroName];
          if (!iconUrl) return '';
          const banDelay = `${(0.38 + index * 0.07).toFixed(2)}s`;
          return (
            `<div class="map-card__ban" style="--ban-delay: ${banDelay}">` +
            `<img src="${escapeHtml(iconUrl)}" alt="">` +
            `<span class="map-card__ban-number"><span>${index + 1}</span></span>` +
            `</div>`
          );
        })
        .join('');
      if (!items) return '';
      return `<div class="map-card__bans">${items}</div>`;
    }

    function winnerDetails(mapData, teamAData, teamBData) {
      const isCompleted = !!(mapData && mapData.completed);
      const aWon = isCompleted && mapData.scoreA > mapData.scoreB;
      const bWon = isCompleted && mapData.scoreB > mapData.scoreA;
      const teamAColor = safeHexColor(teamAData && teamAData.color, '#3ecf8e');
      const teamBColor = safeHexColor(teamBData && teamBData.color, '#ef5b5b');
      const winnerColor = aWon ? teamAColor : bWon ? teamBColor : 'var(--fgc-accent)';
      const winnerTeam = aWon ? teamAData : bWon ? teamBData : null;
      const logoUrl = winnerTeam && winnerTeam.logoUrl;
      return {
        isCompleted,
        aWon,
        bWon,
        teamAColor,
        teamBColor,
        winnerColor,
        logoUrl: logoUrl || '',
        tag: logoUrl ? '' : teamLogoPlaceholderText(winnerTeam),
        winner: aWon ? 'a' : bWon ? 'b' : 'none'
      };
    }

    function createMapCard(mapData, index, teamAData, teamBData, isCurrent, bans) {
      const card = document.createElement('div');
      card.className = isCurrent ? 'map-card map-card--current' : 'map-card';
      card.dataset.index = index;
      card.dataset.current = isCurrent ? 'true' : 'false';
      card.dataset.complete = mapData.completed ? 'true' : 'false';

      const mapNameRaw = mapData.name || '';
      const mapTypeRaw = mapData.type || '';
      const mapImage = mapData.mapImageUrl || '';
      const isCompleted = mapData.completed;
      const hasMap = !!mapNameRaw && mapNameRaw.toLowerCase() !== 'tbc';
      const hasMode = !!mapTypeRaw && mapTypeRaw.toLowerCase() !== 'tbc';

      const mapName = hasMap ? mapNameRaw : 'TBC';
      const mapType = hasMode ? mapTypeRaw : 'TBC';

      const teamAColor = safeHexColor(teamAData && teamAData.color, '#3ecf8e');
      const teamBColor = safeHexColor(teamBData && teamBData.color, '#ef5b5b');
      const aWon = isCompleted && mapData.scoreA > mapData.scoreB;
      const bWon = isCompleted && mapData.scoreB > mapData.scoreA;
      const winnerColor = aWon ? teamAColor : bWon ? teamBColor : 'var(--fgc-accent)';
      card.dataset.winner = aWon ? 'a' : bWon ? 'b' : 'none';
      card.setAttribute(
        'style',
        `--team-a-color: ${teamAColor}; --team-b-color: ${teamBColor}; --winner-color: ${winnerColor};`
      );

      const winnerDetailsForCard = winnerDetails(mapData, teamAData, teamBData);
      let logoContent = '';
      let logoText = '';
      let logoClass = 'map-card__logo';

      if (winnerDetailsForCard.logoUrl) {
        logoContent = `background-image: url('${winnerDetailsForCard.logoUrl}')`;
        logoClass += ' map-card__logo--winner';
      } else if (winnerDetailsForCard.tag) {
        logoText = escapeHtml(winnerDetailsForCard.tag);
        logoClass += ' map-card__logo--winner map-card__logo--placeholder';
      } else {
        logoClass += ' map-card__logo--hidden';
      }

      let imageClass = 'map-card__image';
      let imageStyle = '';

      if (mapImage && (isCompleted || hasMap)) {
        imageStyle = `background-image: url('${mapImage}')`;
      } else {
        imageClass += ' map-card__image--placeholder';
      }
      if (isCompleted) {
        imageClass += ' map-card__image--complete';
      }

      const visualClass =
        isCompleted && (aWon || bWon)
          ? 'map-card__visual map-card__visual--complete'
          : 'map-card__visual';

      const showChosenBy = mapData.chosenByName && (isCompleted || isCurrent || !loserPicks);
      const chosenByText = showChosenBy ? `${mapData.chosenByName}'s Pick` : '';
      const chosenByClass = chosenByText ? 'map-card__chosen-by' : 'map-card__chosen-by map-card__chosen-by--hidden';

      card.innerHTML = `
        <div class="${logoClass}" id="logo-${index}" style="${logoContent}">${logoText}</div>
        <div class="${visualClass}">
          <div class="${imageClass}" id="image-${index}" style="${imageStyle}"></div>
          <div class="map-card__swap"></div>
          ${createBanStrip(bans)}
        </div>
        <div class="map-card__text">
          <div class="map-card__meta">
            <span class="map-card__type">${escapeHtml(mapType || '')}</span>
          </div>
          <div class="map-card__name">${escapeHtml(mapName || '')}</div>
          <div class="${chosenByClass}">${escapeHtml(chosenByText)}</div>
        </div>
      `;

      return card;
    }

    function updateMapsContainer(maps, teamAData, teamBData) {
      el.mapsContainer.innerHTML = '';

      const mapsToShow = projectedMapCardCount(maps);

      for (let i = 0; i < mapsToShow; i++) {
        const mapData = maps[i] || emptyMap();
        const isCurrent = i === currentMapIndex;
        const card = createMapCard(mapData, i, teamAData, teamBData, isCurrent, heroBans[i]);
        if (isCurrent) {
          const settleAfter = 0.1 + (mapsToShow - 1) * 0.1 + 1.25;
          card.style.setProperty('--focus-delay', `calc(var(--anim-delay) + ${settleAfter}s)`);
        }
        el.mapsContainer.appendChild(card);
      }

      renderedCurrentIndex = currentMapIndex;

      if (!animationsTriggered) {
        triggerAnimations();
        animationsTriggered = true;
      } else {
        const cards = el.mapsContainer.querySelectorAll('.map-card');
        cards.forEach(card => {
          card.style.opacity = '1';
          card.style.transform = '';
        });
      }
    }

    function refreshCardContent(card, index, mapData, teamAData, teamBData, bans, picks, isCurrent, iconsChanged) {
      const previousMap = renderedMaps && renderedMaps[index] ? renderedMaps[index] : emptyMap();
      const details = winnerDetails(mapData, teamAData, teamBData);
      const previousDetails = winnerDetails(previousMap, renderedTeamA, renderedTeamB);

      const mapNameRaw = mapData.name || '';
      const mapTypeRaw = mapData.type || '';
      const mapImage = mapData.mapImageUrl || '';
      const hasMap = !!mapNameRaw && mapNameRaw.toLowerCase() !== 'tbc';
      const hasMode = !!mapTypeRaw && mapTypeRaw.toLowerCase() !== 'tbc';
      const mapName = hasMap ? mapNameRaw : 'TBC';
      const mapType = hasMode ? mapTypeRaw : 'TBC';
      const hasArt = !!mapImage && (details.isCompleted || hasMap);

      const identityChanged =
        !sameValue(previousMap.name, mapNameRaw) ||
        !sameValue(previousMap.type, mapTypeRaw) ||
        !sameValue(previousMap.mapImageUrl, mapImage);

      card.style.setProperty('--team-a-color', details.teamAColor);
      card.style.setProperty('--team-b-color', details.teamBColor);
      card.style.setProperty('--winner-color', details.winnerColor);
      card.dataset.complete = details.isCompleted ? 'true' : 'false';
      card.dataset.winner = details.winner;

      const image = card.querySelector('.map-card__image');
      const visual = card.querySelector('.map-card__visual');
      const type = card.querySelector('.map-card__type');
      const name = card.querySelector('.map-card__name');
      const logo = card.querySelector('.map-card__logo');

      image.classList.toggle('map-card__image--placeholder', !hasArt);
      image.classList.toggle('map-card__image--complete', details.isCompleted);
      visual.classList.toggle(
        'map-card__visual--complete',
        details.isCompleted && (details.aWon || details.bWon)
      );

      if (identityChanged) {
        const applyMapContent = () => {
          image.style.backgroundImage = hasArt ? `url('${mapImage}')` : '';
          type.textContent = mapType || '';
          name.textContent = mapName || '';
        };
        // Empty slots have no art to wipe, so a curtain only makes them flicker.
        if (hasArt) {
          animateContentSwap(card, [image, type, name], applyMapContent);
        } else {
          cancelCardSwaps(card);
          applyMapContent();
        }
      }

      if (details.logoUrl) {
        logo.classList.remove('map-card__logo--hidden', 'map-card__logo--placeholder');
        logo.classList.add('map-card__logo--winner');
        logo.textContent = '';
        logo.style.backgroundImage = `url('${details.logoUrl}')`;
        if (previousDetails.logoUrl !== details.logoUrl) {
          animateLogoIn(logo, index);
        }
      } else if (details.tag) {
        logo.style.backgroundImage = '';
        logo.classList.remove('map-card__logo--hidden');
        logo.classList.add('map-card__logo--winner', 'map-card__logo--placeholder');
        if (logo.textContent !== details.tag) {
          logo.textContent = details.tag;
          animateLogoIn(logo, index);
        }
      } else {
        logo.style.backgroundImage = '';
        logo.textContent = '';
        logo.classList.remove('map-card__logo--winner', 'map-card__logo--placeholder');
        logo.classList.add('map-card__logo--hidden');
      }

      const showChosenBy = mapData.chosenByName && (details.isCompleted || isCurrent || !picks);
      const chosenByText = showChosenBy ? `${mapData.chosenByName}'s Pick` : '';
      const chosenBy = card.querySelector('.map-card__chosen-by');
      chosenBy.textContent = chosenByText;
      chosenBy.classList.toggle('map-card__chosen-by--hidden', !chosenByText);

      const bansChanged =
        iconsChanged || !sameValue(renderedHeroBans && renderedHeroBans[index], bans);
      if (bansChanged) {
        const existing = card.querySelector('.map-card__bans');
        if (existing) existing.remove();
        const strip = createBanStrip(bans);
        if (strip) visual.insertAdjacentHTML('beforeend', strip);
      }
    }

    function setCurrentVisual(nextIndex) {
      const cards = Array.from(el.mapsContainer.querySelectorAll('.map-card'));
      const previousCard = cards.find(card => Number(card.dataset.index) === renderedCurrentIndex);
      const nextCard = cards.find(card => Number(card.dataset.index) === nextIndex);

      if (previousCard && previousCard !== nextCard) {
        previousCard.classList.remove('map-card--current');
        previousCard.dataset.current = 'false';
        previousCard.style.removeProperty('--current-grow');
        animateCardWidth(previousCard, 1.8, 1);
      }

      if (nextCard) {
        nextCard.classList.add('map-card--current');
        nextCard.dataset.current = 'true';
        nextCard.style.setProperty('--current-grow', '1.8');
        if (previousCard !== nextCard) {
          animateCardWidth(nextCard, 1, 1.8, () => {
            nextCard.style.removeProperty('--current-grow');
          });
        } else {
          nextCard.style.removeProperty('--current-grow');
        }
      }

      renderedCurrentIndex = nextIndex;
    }

    function ensureCardCount(count, maps, teamAData, teamBData, bans, picks) {
      const container = el.mapsContainer;

      while (container.children.length > count) {
        container.lastElementChild.remove();
      }

      while (container.children.length < count) {
        const index = container.children.length;
        const card = createMapCard(
          maps[index] || emptyMap(),
          index,
          teamAData,
          teamBData,
          index === currentMapIndex,
          bans[index]
        );
        card.classList.add('map-card--settled');
        card.style.opacity = '1';
        card.style.transform = '';
        container.appendChild(card);
      }
    }

    function reconcileMaps(maps, teamAData, teamBData, bans, picks, nextCurrentIndex) {
      if (!openingSettled) {
        settleInitialAnimations();
        openingSettled = true;
      }
      currentMapIndex = nextCurrentIndex;

      const mapsToShow = projectedMapCardCount(maps);
      ensureCardCount(mapsToShow, maps, teamAData, teamBData, bans, picks);

      const iconsChanged = !sameValue(renderedHeroIcons, heroIcons);
      el.mapsContainer.querySelectorAll('.map-card').forEach((card, index) => {
        refreshCardContent(
          card,
          index,
          maps[index] || emptyMap(),
          teamAData,
          teamBData,
          bans[index],
          picks,
          index === nextCurrentIndex,
          iconsChanged
        );
      });

      setCurrentVisual(nextCurrentIndex);
    }

    function connect() {
      // Reach the server that served this page so a LAN or proxied client does
      // not dial its own localhost. ?host= and ?port= still override the target
      // for third-party pages.
      const query = new URLSearchParams(location.search);
      const host = query.get('host');
      const port = query.get('port');
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      const target = host || port
        ? `${host || 'localhost'}:${port || '3001'}`
        : (location.host || 'localhost:3001');
      const ws = new WebSocket(`${scheme}://${target}`);

      ws.onmessage = ({ data }) => {
        try {
          updateOverlay(JSON.parse(data));
        } catch (e) {
          console.error('Parse error:', e);
        }
      };

      ws.onclose = () => setTimeout(connect, 2000);
      ws.onerror = (e) => console.error('WS error:', e);
    }

    // === OVERLAY THEME ===
    // The app sends the active theme as a `theme` message. Its  `tokens` are
    // the complete set of CSS custom properties to override, so a property
    // applied by an earlier theme and missing from this set is removed again.
    // That is what restores the stylesheet defaults when the theme changes.
    let appliedThemeTokens = [];

    function applyTheme(payload) {
      const tokens =
        payload && typeof payload === 'object' && payload.tokens && typeof payload.tokens === 'object'
          ? payload.tokens
          : {};
      const root = document.documentElement;
      appliedThemeTokens.forEach((name) => {
        if (!Object.prototype.hasOwnProperty.call(tokens, name)) root.style.removeProperty(name);
      });
      appliedThemeTokens = Object.keys(tokens);
      appliedThemeTokens.forEach((name) => {
        root.style.setProperty(name, String(tokens[name]));
      });
    }
    function updateOverlay(data) {
      if (window.fgcUpdateBackground) window.fgcUpdateBackground(data);
      const d = data.data || data;
      if (data.type === 'theme') {
        applyTheme(d);
        return;
      }
      if (data.type === 'init' && d.theme) {
        applyTheme(d.theme);
      }


      if (data.type === 'init' && d.scoreboard) {
        return updateOverlay({ type: 'mapSelect', data: d.scoreboard });
      }

      if (data.type === 'scoreboard' || data.type === 'gameOverlay' || data.type === 'mapSelect') {
        const nextCurrent = d.currentMapIndex !== undefined ? d.currentMapIndex : currentMapIndex;
        const nextLoserPicks = d.loserPicks !== undefined ? d.loserPicks : loserPicks;
        const nextBans = d.heroBans !== undefined ? d.heroBans : heroBans;
        const nextIcons = d.heroIcons !== undefined ? d.heroIcons : heroIcons;
        const nextMaps = d.maps !== undefined ? d.maps : renderedMaps || [];
        const nextTeamA = d.teamA !== undefined ? d.teamA : renderedTeamA;
        const nextTeamB = d.teamB !== undefined ? d.teamB : renderedTeamB;

        currentMapIndex = nextCurrent;
        loserPicks = nextLoserPicks;
        heroBans = nextBans;
        heroIcons = nextIcons;

        if (!animationsTriggered && nextMaps.length) {
          updateMapsContainer(nextMaps, nextTeamA, nextTeamB);
        } else if (animationsTriggered) {
          reconcileMaps(nextMaps, nextTeamA, nextTeamB, nextBans, nextLoserPicks, nextCurrent);
        }

        renderedMaps = snapshot(nextMaps);
        renderedHeroBans = snapshot(nextBans);
        renderedHeroIcons = snapshot(nextIcons);
        renderedTeamA = snapshot(nextTeamA);
        renderedTeamB = snapshot(nextTeamB);
        renderedLoserPicks = nextLoserPicks;

        if (d.tournamentLogoUrl) {
          el.tournamentLogo.style.backgroundImage = `url(${d.tournamentLogoUrl})`;
          el.tournamentLogo.classList.remove('icon-hidden');
        } else {
          el.tournamentLogo.classList.add('icon-hidden');
        }
      }

      if (data.type === 'show') {
        el.overlay.style.display = data.visible ? 'block' : 'none';
        if (!data.visible) {
          resetAnimations();
        }
      }
    }

    connect();
  </script>
</body>
</html>
