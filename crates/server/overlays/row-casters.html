<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <title>Casters</title>
  <style>
    @font-face {
      font-family: 'FGC Display Light';
      font-weight: 300;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-300.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display';
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-400.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display Medium';
      font-weight: 500;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-500.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display SemiBold';
      font-weight: 600;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-600.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display Black';
      font-weight: 900;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-900.woff2') format('woff2');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'FGC Display', 'Apotek', sans-serif;
      background: transparent;
    }

    .overlay {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    .main-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 100px;
    }

    /* Casters Container */
    .casters-container {
      display: flex;
      gap: 20px;
      height: 800px;
      width: 100%;
      max-width: 1720px;
    }

    .casters-container.single-caster {
      max-width: 900px;
    }

    /* Camera Card */
    .caster-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-radius: 6px;
      overflow: hidden;
      max-width: none;
    }

    /* Talent Image */
    .talent-image {
      flex: 1;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #2d2d2d;
    }

    /* Talent Text */
    .talent-text {
      background: #fff;
      padding: 15px 10px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* Talent Name */
    .talent-name {
      width: 100%;
      font-family: 'FGC Display Medium', 'Apotek Medium', sans-serif;
      font-size: 48px;
      color: #090909;
      text-transform: uppercase;
      text-align: center;
    }

    /* Subtext Row */
    .talent-subtext {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Social Icon */
    .social-icon {
      width: 20px;
      height: 20px;
    }

    .social-icon svg {
      width: 100%;
      height: 100%;
    }

    /* Social Handle */
    .social-handle {
      font-family: 'FGC Display Light', 'Apotek Light', sans-serif;
      font-size: 24px;
      color: #ac46f7;
    }

    /* Separator */
    .separator {
      font-family: 'FGC Display Light', 'Apotek Light', sans-serif;
      font-size: 24px;
      color: #ac46f7;
    }

    /* Pronouns */
    .pronouns {
      font-family: 'FGC Display Light', 'Apotek Light', sans-serif;
      font-size: 24px;
      color: #ac46f7;
    }

    /* Hidden elements */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="main-container">
      <div class="casters-container" id="casters-container">
        <!-- Caster cards will be dynamically created -->
      </div>
    </div>
  </div>

  <script>
    // Escape user-supplied text before interpolating it into innerHTML.
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      })[character]);
    }

    // Shrink text until it fits on one line, then ellipsize at the floor size.
    function fitText(target, maxSize, minSize) {
      if (!target) return;
      target.style.whiteSpace = 'nowrap';
      target.style.overflow = 'hidden';
      target.style.textOverflow = 'ellipsis';

      const style = getComputedStyle(target);
      const available = target.clientWidth
        - parseFloat(style.paddingLeft)
        - parseFloat(style.paddingRight);
      if (!(available > 0)) return;

      // Ancestors animate with a transform, so convert the measured range
      // back into layout pixels before comparing it with the layout width.
      const measure = () => {
        const range = document.createRange();
        range.selectNodeContents(target);
        const scale = target.offsetWidth
          ? target.getBoundingClientRect().width / target.offsetWidth
          : 1;
        return scale > 0 ? range.getBoundingClientRect().width / scale : 0;
      };

      let size = maxSize;
      target.style.fontSize = `${size}px`;
      while (size > minSize && measure() > available) {
        size -= 1;
        target.style.fontSize = `${size}px`;
      }
    }

    function fitCasterNames() {
      el.castersContainer.querySelectorAll('.talent-name').forEach((name) => {
        fitText(name, 48, 24);
      });
    }

    const el = {
      castersContainer: document.getElementById('casters-container'),
      overlay: document.querySelector('.overlay')
    };

    let ws = null;
    let currentData = null;

    function getTwitterIcon() {
      return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path fill="#ac46f7" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>`;
    }

    function getTwitchIcon() {
      return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path fill="#ac46f7" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/>
      </svg>`;
    }

    function getSocialIcon(platform) {
      switch (platform) {
        case 'twitter':
          return getTwitterIcon();
        case 'twitch':
          return getTwitchIcon();
        default:
          return '';
      }
    }

    function createCasterCard(caster) {
      const card = document.createElement('div');
      card.className = 'caster-card';

      const imageStyle = caster.portraitUrl
        ? `background-image: url('${caster.portraitUrl}')`
        : 'background-color: #2d2d2d';

      const socialIcon = caster.socialMedia?.platform 
        ? `<div class="social-icon">${getSocialIcon(caster.socialMedia.platform)}</div>`
        : '';
      const handle = String(caster.socialMedia?.handle ?? '').trim();
      const socialHandle = handle
        ? `<span class="social-handle">${escapeHtml(handle.startsWith('@') ? handle : `@${handle}`)}</span>`
        : '';
      const separator = (socialIcon || socialHandle) && caster.pronouns 
        ? '<span class="separator">|</span>' 
        : '';
      const pronouns = caster.pronouns 
        ? `<span class="pronouns">${escapeHtml(caster.pronouns)}</span>`
        : '';

      const socialHtml = (socialIcon || socialHandle) ? `
        <div class="talent-subtext">
          ${socialIcon}
          ${socialHandle}
          ${separator}
          ${pronouns}
        </div>
      ` : caster.pronouns ? `
        <div class="talent-subtext">
          <span class="pronouns">${escapeHtml(caster.pronouns)}</span>
        </div>
      ` : '';

      card.innerHTML = `
        <div class="talent-image" style="${imageStyle}"></div>
        <div class="talent-text">
          <div class="talent-name">${escapeHtml(caster.displayName || 'TALENT NAME')}</div>
          ${socialHtml}
        </div>
      `;

      return card;
    }

    function updateCasters() {
      const casters = currentData?.castersData || currentData?.casters?.castersData || [];

      if (casters.length === 0) {
        return;
      }

      el.castersContainer.innerHTML = '';
      casters.forEach(caster => {
        if (caster) {
          el.castersContainer.appendChild(createCasterCard(caster));
        }
      });

      el.castersContainer.classList.toggle('single-caster', casters.length === 1);
      document.fonts.ready.then(fitCasterNames);
    }

    function connect() {
      const port = new URLSearchParams(location.search).get('port') || '3001';
      ws = new WebSocket(`ws://localhost:${port}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'requestInit' }));
      };

      ws.onmessage = ({ data }) => {
        try {
          updateOverlay(JSON.parse(data));
        } catch (e) {
          console.error('Parse error:', e);
        }
      };

      ws.onclose = () => setTimeout(connect, 2000);
      ws.onerror = (e) => console.error('WS error:', e);
    }

    function updateOverlay(data) {
      const d = data.data || data;
      const casters = d?.castersData || d?.casters?.castersData || [];

      if (casters.length > 0) {
        currentData = d;
        updateCasters();
      }

      if (data.type === 'show') {
        el.overlay.style.display = data.visible ? 'block' : 'none';
      }
    }

    document.fonts.ready.then(fitCasterNames);
    connect();
  </script>
</body>
</html>
