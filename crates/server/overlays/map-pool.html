<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <link rel="icon" href="data:,">
  <title>Map Pool</title>
  <style>
    @font-face {
      font-family: 'FGC Display Light';
      font-weight: 300;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-300.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display';
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-400.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display Medium';
      font-weight: 500;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-500.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display SemiBold';
      font-weight: 600;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-600.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display Black';
      font-weight: 900;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-900.woff2') format('woff2');
    }

    /* === NIGHT BROADCAST TOKENS ===
       Shared design tokens for the Fruiterra overlay refresh. Each overlay
       inlines this block, exactly as it inlines its own font faces. */
    :root {
      --fgc-canvas: transparent;

      --fgc-surface: #0b0d12;
      --fgc-surface-raised: #11151d;
      --fgc-surface-inverse: #eef2f8;
      --fgc-surface-muted: #151922;

      --fgc-line: #2a3140;
      --fgc-line-strong: #3a4356;
      --fgc-line-on-inverse: #0b0d12;

      --fgc-text: #eef2f8;
      --fgc-text-muted: #8d99ad;
      --fgc-text-faint: #6b7688;
      --fgc-text-inverse: #0b0d12;

      --fgc-accent: #ff7a1a;
      --fgc-accent-strong: #ff9346;
      --fgc-accent-soft: rgb(255 122 26 / 16%);
      --fgc-on-accent: #0b0d12;

      /* The wash that lights a picked map. The gradient rises from the bottom
         edge of the card, the way the OWWC27 map pool lifts a chosen map out
         of the grid, so the art stays greyscale underneath it. */
      --fgc-pick-glow: rgb(255 122 26 / 45%);
      --fgc-pick-glow-mid: rgb(255 122 26 / 22%);
      --fgc-pick-glow-faint: rgb(255 122 26 / 8%);

      --fgc-success: #3ecf8e;
      --fgc-warning: #f5b84b;
      --fgc-danger: #ef5b5b;

      --fgc-space-1: 4px;
      --fgc-space-2: 8px;
      --fgc-space-3: 12px;
      --fgc-space-4: 16px;
      --fgc-radius-sm: 4px;
      --fgc-radius-md: 6px;
      --fgc-radius-lg: 10px;
      --fgc-radius-pill: 999px;
      --fgc-margin: 43px;

      --fgc-duration-micro: 120ms;
      --fgc-duration-state: 240ms;
      --fgc-duration-reveal: 480ms;
      --fgc-duration-scene: 900ms;
      --fgc-ease-out: cubic-bezier(0.22, 1, 0.36, 1);

      /* Motion tokens for the pool reveal. Each game-mode column enters on
         its own beat, so the pool reads as a sequence of columns instead of
         one flat block that fades in together. */
      --pool-anim-delay: 1.1s;
      --pool-anim-duration: 0.7s;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'FGC Display', 'Apotek', sans-serif;
      background: transparent;
    }

    .overlay {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    @keyframes fadeSlideDown {
      from {
        opacity: 0;
        transform: translateY(-50px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes columnReveal {
      from {
        opacity: 0;
        transform: translateY(36px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .main-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 200px 100px;
      row-gap: 20px;
    }

    .map-pool-header {
      font-family: 'FGC Display Black', 'Apotek Black', sans-serif;
      font-size: 96px;
      color: var(--fgc-text);
      text-transform: uppercase;
      letter-spacing: 4px;
      opacity: 0;
      line-height: 1;
    }

    .map-pool-container {
      width: 1520px;
      height: 800px;
      display: flex;
      align-items: stretch;
      column-gap: 25px;
      overflow: hidden;
    }

    .animate-header {
      animation: fadeSlideDown 1.2s cubic-bezier(0.3, 1, 0.4, 1) 0.8s forwards;
    }

    /* The columns carry the reveal, so the container stays visible. That also
       keeps the empty-pool message readable, because the old container fade
       never ran on the empty branch. */
    .animate-column {
      animation: columnReveal var(--pool-anim-duration) var(--fgc-ease-out) forwards;
      animation-delay: var(--column-delay, var(--pool-anim-delay));
    }

    /* === MAP COLUMN === */
    .map-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow: hidden;
      background: transparent;
      opacity: 0;
    }

    .mode-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      background: var(--fgc-surface);
      border-radius: 6px;
      padding: 10px;
    }

    .mode-icon {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
    }

    .mode-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .mode-name {
      font-family: 'FGC Display Medium', 'Apotek Medium', sans-serif;
      font-size: 20px;
      color: var(--fgc-text);
      text-transform: uppercase;
    }

    /* === MAP CARD === */
    .map-card {
      flex: 1;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      background: transparent;
      clip-path: inset(0 round 6px);
    }

    .map-image {
      flex: 1;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: var(--fgc-surface-muted);
      position: relative;
      border-radius: 6px 6px 0 0;
    }

    .map-image.chosen {
      filter: grayscale(100%);
    }

    /* The picked map is lit from the bottom edge. The wash lives on its own
       layer above the artwork, because the greyscale filter on the artwork
       would otherwise drain the colour out of it. */
    .map-pick-glow {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 42px;
      background: linear-gradient(
        to top,
        var(--fgc-pick-glow) 0%,
        var(--fgc-pick-glow-mid) 30%,
        var(--fgc-pick-glow-faint) 52%,
        rgb(255 122 26 / 0%) 72%
      );
      pointer-events: none;
    }

    /* A thin accent rule separates the lit artwork from the name band. */
    .map-card.picked .map-name {
      background-color: var(--fgc-surface);
      background-image: linear-gradient(
        to top,
        var(--fgc-pick-glow-faint) 0%,
        rgb(255 122 26 / 0%) 100%
      );
      box-shadow: inset 0 2px 0 var(--fgc-accent);
    }

    .map-logo-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .map-logo-overlay img {
      max-width: 80px;
      max-height: 80px;
      object-fit: contain;
    }

    .map-name {
      background: var(--fgc-surface);
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      flex-shrink: 0;
    }

    .map-name-text {
      display: block;
      width: 100%;
      font-family: 'FGC Display SemiBold', 'Apotek Semibold', sans-serif;
      font-size: 18px;
      color: var(--fgc-text);
      text-transform: uppercase;
      text-align: center;
    }

    /* === ICON VISIBILITY === */
    .icon-hidden {
      display: none !important;
    }

    .empty-pool {
      color: var(--fgc-text);
      font-size: 24px;
      text-align: center;
      padding: 100px;
    }
  </style>
  <!-- === FGC CANONICAL FX START === -->
  <style>
    :root {
      --fgc-hex-mask: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' width='56' height='100' viewBox='0 0 56 100'%3E%3Cpath d='M28 66L0 50L0 16L28 0L56 16L56 50L28 66L28 100L0 84L0 50L28 34L56 50L56 84L28 100' fill='none' stroke='%23ffffff' stroke-width='1'/%3E%3C/svg%3E");
    }

    /* The mask repeats every 180x322 px, so exactly one tile of travel lands
       on an identical frame. Keeping the colour uniform is part of that seam:
       a non-repeating gradient would move even though the lattice re-aligned. */
    @keyframes fgcCanonicalFxDrift {
      from { transform: translate3d(0, -322px, 0); }
      to { transform: translate3d(180px, 0, 0); }
    }

    /* The FX siblings come first; the existing roots stay above them without
       changing their geometry, colours or layout. */
    .overlay {
      z-index: 1;
    }

    /* Opaque mode is one plain plate taken from the theme. The lattice is
       hidden in this mode, so a solid background never carries hexagons. */
    .fgc-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      display: none;
      background-color: var(--fgc-surface);
    }

    .fgc-fx {
      position: absolute;
      /* More than one tile on every side, including the travel at both ends. */
      inset: -360px;
      z-index: 0;
      pointer-events: none;
      background-color: var(--fgc-line-strong);
      opacity: 0.16;
      -webkit-mask-image: var(--fgc-hex-mask);
      mask-image: var(--fgc-hex-mask);
      -webkit-mask-size: 180px 322px;
      mask-size: 180px 322px;
      -webkit-mask-repeat: repeat;
      mask-repeat: repeat;
      -webkit-mask-position: center;
      mask-position: center;
      transform: translate3d(0, -322px, 0);
      animation: fgcCanonicalFxDrift 72s linear infinite;
      /* Only this compositor drift changes every frame; the mask never repaints. */
      will-change: transform;
    }

    html[data-fx="off"] .fgc-fx {
      display: none;
    }

    html[data-bg="opaque"] .fgc-bg {
      display: block;
    }

    html[data-bg="opaque"] .fgc-fx {
      display: none;
    }

    /* Reduced motion freezes the drift but keeps the static lattice. */
    @media (prefers-reduced-motion: reduce) {
      .fgc-fx {
        animation: none;
      }
    }
  </style>
  <script>
    (() => {
      const query = new URLSearchParams(location.search);
      const root = document.documentElement;

      const requestedFx = query.get('fx');
      if (requestedFx === 'on' || requestedFx === 'off') {
        root.dataset.fx = requestedFx;
      } else if (root.dataset.fx !== 'off') {
        root.dataset.fx = 'on';
      }

      // Opaque turns transparency off; transparent turns it back on. The
      // short aliases read naturally in a Browser Source URL. A document-level
      // data-bg attribute lets a host page choose the default.
      const requestedBg = query.get('bg');
      const bgMode =
        requestedBg === 'off' ? 'opaque' :
        requestedBg === 'on' ? 'transparent' :
        requestedBg;
      if (bgMode === 'opaque' || bgMode === 'transparent') {
        root.dataset.bg = bgMode;
      } else if (root.dataset.bg !== 'opaque') {
        root.dataset.bg = 'transparent';
      }

      // A cached section message lets the app switch every connected source
      // without an OBS refresh. The URL is only the starting state.
      window.fgcUpdateBackground = (data) => {
        const payload = data && typeof data === 'object' ? (data.data || data) : null;
        const opaque = payload && typeof payload.opaque === 'boolean' ? payload.opaque : null;
        if (opaque !== null) {
          root.dataset.bg = opaque ? 'opaque' : 'transparent';
        }
      };
    })();
  </script>
  <!-- === FGC CANONICAL FX END === -->
</head>
<body>
  <div class="fgc-bg" aria-hidden="true"></div>
  <div class="fgc-fx" aria-hidden="true"></div>
  <div class="overlay">
    <div class="main-container">
      <h1 class="map-pool-header">Map Pool</h1>
      <div class="map-pool-container" id="map-pool">
        <!-- Map columns will be dynamically created -->
      </div>
    </div>
  </div>

  <script>
    // Escape user-supplied text before interpolating it into innerHTML.
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      })[character]);
    }

    // Shrink text until it fits on one line, then ellipsize at the floor size.
    function fitText(target, maxSize, minSize) {
      if (!target) return;
      target.style.whiteSpace = 'nowrap';
      target.style.overflow = 'hidden';
      target.style.textOverflow = 'ellipsis';

      const style = getComputedStyle(target);
      const available = target.clientWidth
        - parseFloat(style.paddingLeft)
        - parseFloat(style.paddingRight);
      if (!(available > 0)) return;

      // Ancestors animate with a transform, so convert the measured range
      // back into layout pixels before comparing it with the layout width.
      const measure = () => {
        const range = document.createRange();
        range.selectNodeContents(target);
        const scale = target.offsetWidth
          ? target.getBoundingClientRect().width / target.offsetWidth
          : 1;
        return scale > 0 ? range.getBoundingClientRect().width / scale : 0;
      };

      let size = maxSize;
      target.style.fontSize = `${size}px`;
      while (size > minSize && measure() > available) {
        size -= 1;
        target.style.fontSize = `${size}px`;
      }
    }

    function fitMapNames() {
      el.mapPool.querySelectorAll('.map-name-text').forEach((name) => {
        fitText(name, 18, 11);
      });
    }

    const el = {
      mapPool: document.getElementById('map-pool'),
      overlay: document.querySelector('.overlay'),
      header: document.querySelector('.map-pool-header')
    };

    let gameModeIcons = {};
    let currentData = null;
    let isRendering = false;
    let headerAnimated = false;
    let columnsAnimated = false;
    let renderedSignature = '';
    let emptyShown = false;

    // Seconds between one mode column and the next. The pool holds up to five
    // columns, so the whole reveal still lands inside a couple of seconds.
    const COLUMN_STAGGER_SECONDS = 0.13;

    // The pool arrives as a cached `init` frame and then as a live `scoreboard`
    // frame. Rebuilding the columns for every frame would restart the reveal
    // on each one, so the columns are only rebuilt when the pool really
    // changed.
    function poolSignature(sortedData) {
      return sortedData
        .map((group) =>
          `${group.modeName}[${group.maps
            .map((map) => `${map.name}:${map.chosenBy || ''}:${map.chosenByLogo || ''}`)
            .join(',')}]`
        )
        .join('|');
    }

    function triggerAnimations() {
      if (!headerAnimated) {
        el.header.classList.add('animate-header');
        headerAnimated = true;
      }

      if (columnsAnimated) return;

      const columns = el.mapPool.querySelectorAll('.map-column');
      if (columns.length === 0) return;

      // Each mode column enters on its own beat so the pool reads as a
      // sequence of columns instead of one flat block.
      columns.forEach((column, i) => {
        column.style.setProperty(
          '--column-delay',
          `calc(var(--pool-anim-delay) + ${i * COLUMN_STAGGER_SECONDS}s)`
        );
        column.classList.add('animate-column');
      });

      columnsAnimated = true;
    }

    function preloadImages(urls) {
      urls.forEach(url => {
        if (url) {
          const img = new Image();
          img.src = url;
        }
      });
    }

    function createModeHeader(modeName, modeData) {
      if (modeData?.icons) {
        preloadImages(modeData.icons.filter(Boolean));
      }
      
      if (!modeData || !modeData.icons || modeData.icons.length === 0) {
        return `<div class="mode-header"><span class="mode-name">${escapeHtml(modeName)}</span></div>`;
      }
      
      const iconsHtml = modeData.icons
        .filter(iconUrl => iconUrl)
        .map(iconUrl => `<div class="mode-icon"><img src="${escapeHtml(iconUrl)}" alt="mode icon" /></div>`)
        .join('');
      
      return `<div class="mode-header">${iconsHtml}<span class="mode-name">${escapeHtml(modeName)}</span></div>`;
    }

    function createMapCard(mapData) {
      const card = document.createElement('div');

      if (mapData.imageUrl) {
        preloadImages([mapData.imageUrl]);
      }

      const imageStyle = mapData.imageUrl
        ? `background-image: url('${mapData.imageUrl}')`
        : 'background-color: var(--fgc-surface-muted)';

      const isChosen = mapData.chosenBy && mapData.chosenByLogo;
      const imageClass = isChosen ? 'map-image chosen' : 'map-image';

      card.className = isChosen ? 'map-card picked' : 'map-card';

      let overlayHtml = '';
      if (isChosen) {
        // The glow sits under the team logo, so the logo stays the brightest
        // thing on the card.
        overlayHtml = `
          <div class="map-pick-glow"></div>
          <div class="map-logo-overlay"><img src="${escapeHtml(mapData.chosenByLogo)}" alt="chosen by team" /></div>
        `;
      }

      card.innerHTML = `
        <div class="${imageClass}" style="${imageStyle}"></div>
        ${overlayHtml}
        <div class="map-name">
          <span class="map-name-text">${escapeHtml(mapData.name)}</span>
        </div>
      `;

      return card;
    }

    function createColumn(modeName, maps, modeData) {
      const column = document.createElement('div');
      column.className = 'map-column';

      const headerHtml = createModeHeader(modeName, modeData);
      column.innerHTML = headerHtml;

      maps.forEach(map => {
        column.appendChild(createMapCard(map));
      });

      return column;
    }

    function sortPoolData(poolData) {
      const flashpointPush = ['Flashpoint', 'Push'];
      const otherModes = [];
      const fpPushModes = [];
      
      for (const modeGroup of poolData) {
        if (flashpointPush.includes(modeGroup.modeName)) {
          fpPushModes.push(modeGroup);
        } else {
          otherModes.push(modeGroup);
        }
      }
      
      otherModes.sort((a, b) => a.modeName.localeCompare(b.modeName));
      fpPushModes.sort((a, b) => a.modeName.localeCompare(b.modeName));
      
      return [...otherModes, ...fpPushModes];
    }

    function updateMapPool() {
      if (!currentData || isRendering) return;

      const poolData = currentData.mapPoolData;

      if (!poolData || poolData.length === 0) {
        renderedSignature = '';
        if (!emptyShown) {
          el.mapPool.innerHTML = '<div class="empty-pool">No maps in pool</div>';
          emptyShown = true;
        }
        triggerAnimations();
        return;
      }

      emptyShown = false;

      const sortedData = sortPoolData(poolData);
      const signature = poolSignature(sortedData);

      if (signature === renderedSignature) {
        // Nothing changed, so keep the columns and the reveal as they are.
        return;
      }

      isRendering = true;
      renderedSignature = signature;

      el.mapPool.innerHTML = '';

      for (const modeGroup of sortedData) {
        if (modeGroup.maps && modeGroup.maps.length > 0) {
          el.mapPool.appendChild(createColumn(modeGroup.modeName, modeGroup.maps, { icons: modeGroup.modeIcons }));
        }
      }

      document.fonts.ready.then(fitMapNames);
      isRendering = false;

      if (columnsAnimated) {
        // The pool changed after the reveal, so show the new columns straight
        // away instead of replaying it.
        el.mapPool.querySelectorAll('.map-column').forEach((column) => {
          column.style.opacity = '1';
          column.style.transform = '';
        });
      }

      triggerAnimations();
    }

    function connect() {
      // Reach the server that served this page so a LAN or proxied client does
      // not dial its own localhost. ?host= and ?port= still override the target
      // for third-party pages.
      const query = new URLSearchParams(location.search);
      const host = query.get('host');
      const port = query.get('port');
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      const target = host || port
        ? `${host || 'localhost'}:${port || '3001'}`
        : (location.host || 'localhost:3001');
      const ws = new WebSocket(`${scheme}://${target}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'requestInit' }));
      };

      ws.onmessage = ({ data }) => {
        try {
          updateOverlay(JSON.parse(data));
        } catch (e) {
          console.error('Parse error:', e);
        }
      };

      ws.onclose = () => {
        setTimeout(connect, 2000);
      };
      ws.onerror = (e) => console.error('WS error:', e);
    }

    // === OVERLAY THEME ===
    // The app sends the active theme as a `theme` message. Its  `tokens` are
    // the complete set of CSS custom properties to override, so a property
    // applied by an earlier theme and missing from this set is removed again.
    // That is what restores the stylesheet defaults when the theme changes.
    let appliedThemeTokens = [];

    function applyTheme(payload) {
      const tokens =
        payload && typeof payload === 'object' && payload.tokens && typeof payload.tokens === 'object'
          ? payload.tokens
          : {};
      const root = document.documentElement;
      appliedThemeTokens.forEach((name) => {
        if (!Object.prototype.hasOwnProperty.call(tokens, name)) root.style.removeProperty(name);
      });
      appliedThemeTokens = Object.keys(tokens);
      appliedThemeTokens.forEach((name) => {
        root.style.setProperty(name, String(tokens[name]));
      });
    }
    function updateOverlay(data) {
      if (window.fgcUpdateBackground) window.fgcUpdateBackground(data);
      const d = data.data || data;
      if (data.type === 'theme') {
        applyTheme(d);
        return;
      }
      if (data.type === 'init' && d.theme) {
        applyTheme(d.theme);
      }


      if (data.type === 'init') {
        const mapPoolData = d.scoreboard?.mapPoolData || d.mapPoolData;
        if (mapPoolData && mapPoolData.length > 0) {
          return updateOverlay({ type: 'mapPool', data: { ...d, mapPoolData } });
        }
        return;
      }

      if (data.type === 'scoreboard' || data.type === 'mapPool') {
        currentData = d;

        if (d.gameModeIcons) {
          gameModeIcons = d.gameModeIcons;
        }

        updateMapPool();
      }

      if (data.type === 'show') {
        el.overlay.style.display = data.visible ? 'block' : 'none';
      }
    }

    document.fonts.ready.then(fitMapNames);
    connect();
  </script>
</body>
</html>
