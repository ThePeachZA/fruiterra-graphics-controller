<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <link rel="icon" href="data:,">
  <title>Map Pool</title>
  <style>
    /* Critical document guard: contain overscanned FX/lattice layers during load so transient scrollbars never appear. */
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    @font-face {
      font-family: 'FGC Display Light';
      font-weight: 300;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-300.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display';
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-400.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display Medium';
      font-weight: 500;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-500.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display SemiBold';
      font-weight: 600;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-600.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display Black';
      font-weight: 900;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-900.woff2') format('woff2');
    }

    /* === NIGHT BROADCAST TOKENS ===
       Shared design tokens for the Fruiterra overlay refresh. Each overlay
       inlines this block, exactly as it inlines its own font faces. */
    :root {
      --fgc-canvas: transparent;

      --fgc-surface: #0b0d12;
      --fgc-surface-raised: #11151d;
      --fgc-surface-inverse: #eef2f8;
      --fgc-surface-muted: #151922;

      --fgc-line: #2a3140;
      --fgc-line-strong: #3a4356;
      --fgc-line-on-inverse: #0b0d12;

      --fgc-text: #eef2f8;
      --fgc-text-muted: #8d99ad;
      --fgc-text-faint: #6b7688;
      --fgc-text-inverse: #0b0d12;

      /* Tag fallbacks sit on fixed dark plates, so they stay light in every theme. */
      --fgc-tag-ink: #eef2f8;

      --fgc-accent: #ff7a1a;
      --fgc-accent-strong: #ff9346;
      --fgc-accent-soft: rgb(255 122 26 / 16%);
      --fgc-on-accent: #0b0d12;

      /* Picked maps use --pick-glow-rgb from the choosing team for every wash,
         rule, and crest shadow. No fixed orange survives in the pick state. */

      --fgc-success: #3ecf8e;
      --fgc-warning: #f5b84b;
      --fgc-danger: #ef5b5b;

      --fgc-space-1: 4px;
      --fgc-space-2: 8px;
      --fgc-space-3: 12px;
      --fgc-space-4: 16px;
      --fgc-radius-sm: 4px;
      --fgc-radius-md: 6px;
      --fgc-radius-lg: 10px;
      --fgc-radius-pill: 999px;
      --fgc-margin: 43px;

      --fgc-duration-micro: 120ms;
      --fgc-duration-state: 240ms;
      --fgc-duration-reveal: 480ms;
      --fgc-duration-scene: 900ms;
      --fgc-ease-out: cubic-bezier(0.22, 1, 0.36, 1);

      /* Motion tokens for the pool reveal. Each game-mode column enters on
         its own beat, so the pool reads as a sequence of columns instead of
         one flat block that fades in together. */
      --pool-anim-delay: 1.1s;
      --pool-anim-duration: 0.7s;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'FGC Display', 'Apotek', sans-serif;
      background: transparent;
    }

    .overlay {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    @keyframes columnReveal {
      from {
        opacity: 0;
        transform: translateY(32px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cardReveal {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes modeMarkReveal {
      from {
        opacity: 0;
        transform: scale(0.72) translateY(-6px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes pickWashReveal {
      from {
        opacity: 0;
        transform: scale(1.04);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .main-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 72px;
    }

    .map-pool-container {
      width: 1768px;
      height: 968px;
      display: flex;
      align-items: stretch;
      column-gap: 18px;
      overflow: hidden;
    }

    /* The columns carry the reveal, so no whole-pool fade can wipe a live
       update. Cards add a shorter beat inside each column. */
    .animate-column {
      animation: columnReveal var(--pool-anim-duration) var(--fgc-ease-out) both;
      animation-delay: var(--column-delay, var(--pool-anim-delay));
    }

    .animate-card {
      animation: cardReveal 520ms var(--fgc-ease-out) both;
      animation-delay: var(--card-delay, var(--pool-anim-delay));
    }

    /* Mode marks land just after their column so the header reads as a beat,
       not as a label that was already sitting on the canvas. */
    .animate-mode {
      animation: modeMarkReveal 420ms var(--fgc-ease-out) both;
      animation-delay: var(--mode-delay, var(--pool-anim-delay));
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-column,
      .animate-card,
      .animate-mode {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }

    /* === MAP COLUMN === */
    .map-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
      opacity: 1;
    }

    .mode-header {
      min-height: 62px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      background: var(--fgc-surface-raised);
      border: 1px solid var(--fgc-line);
      border-radius: 8px;
      padding: 8px 12px;
    }

    /* Mode icons are plain marks: the header carries the mode name, so no
       hexagon needs to frame the icon. Map thumbnails stay rectangular too. */
    .mode-icon {
      width: 42px;
      height: 48px;
      flex-shrink: 0;
      position: relative;
    }

    .mode-icon img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.55));
    }

    .mode-name {
      display: inline-block;
      font-family: 'FGC Display Medium', 'Apotek Medium', sans-serif;
      font-size: 18px;
      letter-spacing: 1.2px;
      color: var(--fgc-text);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    /* === MAP CARD === */
    .map-card {
      flex: 1;
      min-height: 0;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--fgc-surface-muted);
      clip-path: inset(0 round 10px);
    }

    /* Flex rounding can leave a one-pixel gutter at either card edge. */
    .map-image {
      flex: 1;
      min-height: 0;
      margin-inline: -1px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: var(--fgc-surface-muted);
      position: relative;
      border-radius: 10px 10px 0 0;
    }

    /* The winner wash sits above the darkened art and under the black footer
       gradient. It is the same radial language as the map-select winner card. */
    .map-image::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(
        circle at 50% 46%,
        rgb(var(--pick-glow-rgb, 255 122 26) / 20%),
        transparent 68%
      );
      opacity: 0;
      pointer-events: none;
    }

    .map-image::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.28) 48%,
        rgba(0, 0, 0, 0.78) 100%
      );
      pointer-events: none;
    }

    .map-image.chosen {
      filter: grayscale(100%) brightness(0.56) saturate(0.45);
    }

    .map-card.picked .map-image::before {
      opacity: 1;
    }

    .map-card.animate-pick .map-image::before {
      animation: pickWashReveal 620ms var(--fgc-ease-out) 60ms both;
    }

    /* A dark curtain covers map swaps so no empty surface can flash through. */
    .map-card__swap {
      position: absolute;
      inset: -1px;
      z-index: 3;
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 0.28) 48%,
          rgba(0, 0, 0, 0.78) 100%
        ),
        var(--fgc-surface-muted);
    }

    /* The picked map is lit from its bottom edge in the choosing team's
       colour. The wash lives above the artwork so greyscale cannot drain it. */
    .map-pick-glow {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 52px;
      z-index: 4;
      background:
        linear-gradient(
          to top,
          rgb(var(--pick-glow-rgb, 255 122 26) / 62%) 0%,
          rgb(var(--pick-glow-rgb, 255 122 26) / 34%) 32%,
          rgb(var(--pick-glow-rgb, 255 122 26) / 12%) 56%,
          rgb(var(--pick-glow-rgb, 255 122 26) / 0%) 76%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgb(var(--pick-glow-rgb, 255 122 26) / 48%) 0%,
          rgb(var(--pick-glow-rgb, 255 122 26) / 0%) 72%
        );
      pointer-events: none;
    }

    .map-card.picked .map-name {
      background-color: var(--fgc-surface);
      background-image: linear-gradient(
        to top,
        rgb(var(--pick-glow-rgb, 255 122 26) / 12%) 0%,
        rgb(var(--pick-glow-rgb, 255 122 26) / 0%) 100%
      );
      box-shadow: inset 0 2px 0 rgb(var(--pick-glow-rgb, 255 122 26));
    }

    .map-logo-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 52px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .map-logo-overlay img {
      max-width: 92px;
      max-height: 92px;
      object-fit: contain;
      filter: drop-shadow(0 0 22px rgb(var(--pick-glow-rgb, 255 122 26) / 85%));
    }

    .map-logo-overlay__tag {
      max-width: 92px;
      padding: 7px 10px;
      background: linear-gradient(180deg, rgb(11 13 18 / 82%), rgb(11 13 18 / 58%));
      border: 1px solid rgb(238 242 248 / 18%);
      border-radius: 4px;
      font-family: 'FGC Display SemiBold', 'Apotek Semibold', sans-serif;
      font-size: 30px;
      letter-spacing: 0.08em;
      line-height: 1;
      text-align: center;
      color: var(--fgc-tag-ink);
      text-shadow: 0 2px 10px rgb(0 0 0 / 70%), 0 0 22px rgb(var(--pick-glow-rgb, 255 122 26) / 85%);
      overflow-wrap: anywhere;
    }

    .map-name {
      background: var(--fgc-surface);
      height: 52px;
      container-type: inline-size;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 6;
      overflow: hidden;
    }

    /* Long names shrink to the card, then wrap to two lines instead of
       disappearing behind an ellipsis. */
    .map-name-text {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      width: 100%;
      font-family: 'FGC Display SemiBold', 'Apotek Semibold', sans-serif;
      font-size: clamp(13px, 9cqw, 20px);
      line-height: 1.05;
      color: var(--fgc-text);
      text-transform: uppercase;
      text-align: center;
      overflow-wrap: anywhere;
      overflow: hidden;
    }

    .map-card__text-ghost {
      position: absolute;
      box-sizing: border-box;
      z-index: 7;
      pointer-events: none;
      animation: none !important;
    }

    /* === ICON VISIBILITY === */
    .empty-pool {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fgc-text-muted);
      font-size: 24px;
      text-align: center;
      background: var(--fgc-surface-raised);
      border: 1px solid var(--fgc-line);
      border-radius: 10px;
    }
  </style>
  <!-- === FGC CANONICAL FX START === -->
  <style>
    :root {
      --fgc-hex-mask: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' width='56' height='100' viewBox='0 0 56 100'%3E%3Cpath d='M28 66L0 50L0 16L28 0L56 16L56 50L28 66L28 100L0 84L0 50L28 34L56 50L56 84L28 100' fill='none' stroke='%23ffffff' stroke-width='1'/%3E%3C/svg%3E");
    }

    /* The mask repeats every 180x322 px, so exactly one tile of travel lands
       on an identical frame. Keeping the colour uniform is part of that seam:
       a non-repeating gradient would move even though the lattice re-aligned. */
    @keyframes fgcCanonicalFxDrift {
      from { transform: translate3d(0, -322px, 0); }
      to { transform: translate3d(180px, 0, 0); }
    }

    /* The FX siblings come first; the existing roots stay above them without
       changing their geometry, colours or layout. */
    .overlay {
      z-index: 1;
    }

    /* Opaque mode is one plain plate taken from the theme. The lattice stays
       on top of it, so both modes carry the hexagon display. */
    .fgc-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      display: none;
      background-color: var(--fgc-surface);
    }

    .fgc-fx {
      position: absolute;
      /* More than one tile on every side, including the travel at both ends. */
      inset: -360px;
      z-index: 0;
      pointer-events: none;
      background-color: var(--fgc-line-strong);
      opacity: 0.16;
      -webkit-mask-image: var(--fgc-hex-mask);
      mask-image: var(--fgc-hex-mask);
      -webkit-mask-size: 180px 322px;
      mask-size: 180px 322px;
      -webkit-mask-repeat: repeat;
      mask-repeat: repeat;
      -webkit-mask-position: center;
      mask-position: center;
      transform: translate3d(0, -322px, 0);
      animation: fgcCanonicalFxDrift 72s linear infinite;
      /* Only this compositor drift changes every frame; the mask never repaints. */
      will-change: transform;
    }

    html[data-fx="off"] .fgc-fx {
      display: none;
    }

    html[data-bg="opaque"] .fgc-bg {
      display: block;
    }


    /* Reduced motion freezes the drift but keeps the static lattice. */
    @media (prefers-reduced-motion: reduce) {
      .fgc-fx {
        animation: none;
      }
    }
  </style>
  <script>
    (() => {
      const query = new URLSearchParams(location.search);
      const root = document.documentElement;

      const requestedFx = query.get('fx');
      if (requestedFx === 'on' || requestedFx === 'off') {
        root.dataset.fx = requestedFx;
      } else if (root.dataset.fx !== 'off') {
        root.dataset.fx = 'on';
      }

      // Opaque is the default; transparent turns it back on. The short aliases
      // read naturally in a Browser Source URL. A document-level data-bg
      // attribute lets a host page override that default.
      const requestedBg = query.get('bg');
      const bgMode =
        requestedBg === 'off' ? 'opaque' :
        requestedBg === 'on' ? 'transparent' :
        requestedBg;
      if (bgMode === 'opaque' || bgMode === 'transparent') {
        root.dataset.bg = bgMode;
      } else if (root.dataset.bg !== 'opaque' && root.dataset.bg !== 'transparent') {
        root.dataset.bg = 'opaque';
      }

      // A cached section message lets the app switch every connected source
      // without an OBS refresh. It also arrives inside the keyed init frame
      // when a source refreshes, so the URL is only the starting state.
      window.fgcUpdateBackground = (data) => {
        const payload = data && typeof data === 'object' ? (data.data || data) : null;
        const section = payload && payload.background && typeof payload.background === 'object'
          ? payload.background
          : null;
        const candidate = section || payload;
        const opaque = candidate && typeof candidate.opaque === 'boolean' ? candidate.opaque : null;
        if (opaque !== null) {
          root.dataset.bg = opaque ? 'opaque' : 'transparent';
        }
      };
    })();
  </script>
  <!-- === FGC CANONICAL FX END === -->
</head>
<body>
  <div class="fgc-bg" aria-hidden="true"></div>
  <div class="fgc-fx" aria-hidden="true"></div>
  <div class="overlay">
    <div class="main-container">
      <div class="map-pool-container" id="map-pool" aria-label="Map pool">
        <!-- Map columns will be dynamically created -->
      </div>
    </div>
  </div>
  <script>
    // Escape user-supplied text before interpolating it into innerHTML.
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      })[character]);
    }

    const el = {
      mapPool: document.getElementById('map-pool'),
      overlay: document.querySelector('.overlay')
    };

    let gameModeIcons = {};
    let currentData = null;
    let renderedSignature = '';
    let renderedPool = null;
    let openingSettled = false;
    let emptyShown = false;

    // Seconds between reveals. The pool holds up to five columns and a few
    // cards each, so the whole opening still lands inside a couple of seconds.
    const COLUMN_STAGGER_SECONDS = 0.13;
    const CARD_STAGGER_SECONDS = 0.07;
    const CONTENT_IN_DURATION = 420;
    const CURTAIN_FADE_DURATION = 360;
    const LOGO_REVEAL_DURATION = 620;
    const PICK_GLOW_DURATION = 620;
    // Dark team colours disappear against the pool art. Lift the glow toward
    // white so a pick stays readable while keeping the team's hue.
    const PICK_LIGHTEN_MIX = 0.45;
    const FOCUS_EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';

    function snapshot(value) {
      return value === undefined ? undefined : JSON.parse(JSON.stringify(value));
    }

    function sameValue(left, right) {
      return JSON.stringify(left) === JSON.stringify(right);
    }

    function prefersReducedMotion() {
      return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    function hexToRgbTriplet(color) {
      const match = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(color || '').trim());
      if (!match) return '255 122 26';
      const hex = match[1].length === 3
        ? match[1].split('').map((part) => part + part).join('')
        : match[1];
      return `${parseInt(hex.slice(0, 2), 16)} ${parseInt(hex.slice(2, 4), 16)} ${parseInt(hex.slice(4, 6), 16)}`;
    }

    function lightenedRgbTriplet(color) {
      return hexToRgbTriplet(color)
        .split(' ')
        .map((channel) => Math.round(Number(channel) + (255 - Number(channel)) * PICK_LIGHTEN_MIX))
        .join(' ');
    }

    function teamColors(data) {
      return {
        A: lightenedRgbTriplet(data?.teamA?.color),
        B: lightenedRgbTriplet(data?.teamB?.color)
      };
    }

    function teamLogoPlaceholderText(team) {
      if (!team) return '';
      const tag = typeof team.tag === 'string' ? team.tag.trim() : '';
      if (tag) return tag;
      const name = typeof team.name === 'string' ? team.name.trim() : '';
      if (!name) return '';
      const parts = name.split(/\s+/).filter(Boolean);
      if (parts.length === 1) return Array.from(parts[0]).slice(0, 2).join('').toUpperCase();
      return parts.slice(0, 2).map((part) => Array.from(part)[0].toUpperCase()).join('');
    }

    function chosenByTag(mapData) {
      const team = mapData.chosenBy === 'B' ? currentData?.teamB : currentData?.teamA;
      return team && !mapData.chosenByLogo ? teamLogoPlaceholderText(team) : '';
    }

    function pickRgb(mapData, colors) {
      return mapData.chosenBy === 'B' ? colors.B : colors.A;
    }

    // The app broadcasts several identical scoreboard frames for one edit.
    // Comparing the full visible state keeps all but the first one a no-op.
    function poolSignature(sortedData, colors) {
      return JSON.stringify({
        groups: sortedData.map((group) => ({
          modeName: group.modeName,
          modeIcons: group.modeIcons || [],
          maps: (group.maps || []).map((map) => ({
            name: map.name,
            imageUrl: map.imageUrl || '',
            chosenBy: map.chosenBy || '',
            chosenByLogo: map.chosenByLogo || '',
            chosenByTag: chosenByTag(map)
          }))
        })),
        colors
      });
    }

    function preloadImages(urls) {
      urls.forEach((url) => {
        if (url) {
          const img = new Image();
          img.src = url;
        }
      });
    }

    function createModeHeader(modeName, modeData) {
      if (modeData?.icons) {
        preloadImages(modeData.icons.filter(Boolean));
      }

      if (!modeData || !modeData.icons || modeData.icons.length === 0) {
        return `<div class="mode-header"><span class="mode-name">${escapeHtml(modeName)}</span></div>`;
      }

      const iconsHtml = modeData.icons
        .filter((iconUrl) => iconUrl)
        .map((iconUrl) => `<div class="mode-icon"><img src="${escapeHtml(iconUrl)}" alt="mode icon" /></div>`)
        .join('');

      return `<div class="mode-header">${iconsHtml}<span class="mode-name">${escapeHtml(modeName)}</span></div>`;
    }

    function cancelCardAnimations(card) {
      if (card._swapAnimations) {
        card._swapAnimations.forEach((animation) => animation.cancel());
      }
      card._swapAnimations = [];
      card.classList.remove('animate-pick');
      const swapLayer = card.querySelector('.map-card__swap');
      if (swapLayer) swapLayer.style.removeProperty('opacity');
      card.querySelectorAll('.map-card__text-ghost').forEach((ghost) => ghost.remove());
    }

    function animateLogoIn(image, animations) {
      if (!image || prefersReducedMotion()) return null;
      image.getAnimations().forEach((animation) => animation.cancel());
      const animation = image.animate(
        [
          { opacity: 0, transform: 'scale(0.86)' },
          { opacity: 1, transform: 'scale(1)' }
        ],
        { duration: LOGO_REVEAL_DURATION, easing: FOCUS_EASE, fill: 'forwards' }
      );
      if (animations) {
        animations.push(animation);
      } else {
        animation.finished.then(() => animation.cancel(), () => {});
      }
      return animation;
    }

    function refreshPickedState(card, mapData, colors, animations, revealPick) {
      const image = card.querySelector('.map-image');
      const nameBar = card.querySelector('.map-name');
      const tag = chosenByTag(mapData);
      const isPicked = !!(mapData.chosenBy && (mapData.chosenByLogo || tag));

      image.classList.toggle('chosen', isPicked);
      card.classList.toggle('picked', isPicked);
      card.style.setProperty('--pick-glow-rgb', pickRgb(mapData, colors));

      let glow = card.querySelector('.map-pick-glow');
      let logoLayer = card.querySelector('.map-logo-overlay');

      if (!isPicked) {
        if (glow) glow.remove();
        if (logoLayer) logoLayer.remove();
        return;
      }

      if (!glow) {
        glow = document.createElement('div');
        glow.className = 'map-pick-glow';
        card.insertBefore(glow, nameBar);
      }
      if (!logoLayer) {
        logoLayer = document.createElement('div');
        logoLayer.className = 'map-logo-overlay';
        card.insertBefore(logoLayer, nameBar);
      }

      const key = mapData.chosenByLogo || tag;
      if (logoLayer.dataset.key !== key) {
        if (mapData.chosenByLogo) {
          logoLayer.innerHTML = `<img src="${escapeHtml(mapData.chosenByLogo)}" alt="chosen by team" />`;
        } else {
          logoLayer.innerHTML = '<span class="map-logo-overlay__tag"></span>';
          logoLayer.firstElementChild.textContent = tag;
        }
        logoLayer.dataset.key = key;
        if (revealPick) animateLogoIn(logoLayer.firstElementChild, animations);
      } else if (revealPick) {
        animateLogoIn(logoLayer.firstElementChild, animations);
      }
    }

    function createMapCard(mapData, colors, slot) {
      const card = document.createElement('div');
      card.className = 'map-card';
      card.dataset.slot = String(slot);
      card.style.setProperty('--pick-glow-rgb', pickRgb(mapData, colors));

      if (mapData.imageUrl) {
        preloadImages([mapData.imageUrl]);
      }

      const imageStyle = mapData.imageUrl
        ? `background-image: url('${mapData.imageUrl}')`
        : 'background-color: var(--fgc-surface-muted)';

      card.innerHTML = `
        <div class="map-image" style="${imageStyle}"></div>
        <div class="map-card__swap"></div>
        <div class="map-name"><span class="map-name-text">${escapeHtml(mapData.name)}</span></div>
      `;

      refreshPickedState(card, mapData, colors, null, false);
      card._map = snapshot(mapData);
      return card;
    }

    // Cover first, swap once, then reveal. A separate fade-out made a map
    // edit read as two animations, so image and text share one pass. A team
    // pick joins that same pass: its bottom wash rises and the winner crest
    // arrives with the new artwork instead of popping in afterwards.
    function animateCardSwap(card, applyUpdate, options = {}) {
      cancelCardAnimations(card);
      const swapLayer = card.querySelector('.map-card__swap');
      if (prefersReducedMotion() || !swapLayer) {
        applyUpdate();
        return;
      }

      const token = String(Number(card.dataset.swap || '0') + 1);
      card.dataset.swap = token;
      const animations = [];

      const nameBar = card.querySelector('.map-name');
      let nameGhost = null;
      if (nameBar) {
        const nameBox = nameBar.getBoundingClientRect();
        const cardBox = card.getBoundingClientRect();
        nameGhost = nameBar.cloneNode(true);
        nameGhost.classList.add('map-card__text-ghost');
        nameGhost.style.left = `${nameBox.left - cardBox.left}px`;
        nameGhost.style.top = `${nameBox.top - cardBox.top}px`;
        nameGhost.style.width = `${nameBox.width}px`;
        nameGhost.style.height = `${nameBox.height}px`;
        card.appendChild(nameGhost);
      }

      swapLayer.style.opacity = '1';
      applyUpdate(animations);

      if (options.pickChanged && card.classList.contains('picked')) {
        card.classList.add('animate-pick');
        const glow = card.querySelector('.map-pick-glow');
        if (glow) {
          animations.push(
            glow.animate(
              [
                { opacity: 0, transform: 'translateY(28px)' },
                { opacity: 1, transform: 'translateY(0)' }
              ],
              {
                duration: PICK_GLOW_DURATION,
                delay: 60,
                easing: FOCUS_EASE,
                fill: 'forwards'
              }
            )
          );
        }
      }

      // Art leads; the old name fades out as the new name reveals together.
      const targets = [card.querySelector('.map-image'), card.querySelector('.map-name')].filter(Boolean);
      targets.forEach((target, index) =>
        animations.push(
          target.animate(
            [
              { opacity: 0, transform: 'translateY(6px)' },
              { opacity: 1, transform: 'translateY(0)' }
            ],
            {
              duration: CONTENT_IN_DURATION,
              delay: index === 0 ? 0 : 60,
              easing: FOCUS_EASE,
              fill: 'forwards'
            }
          )
        )
      );
      animations.push(
        swapLayer.animate(
          [{ opacity: 1 }, { opacity: 0 }],
          { duration: CURTAIN_FADE_DURATION, easing: FOCUS_EASE, fill: 'forwards' }
        )
      );
      if (nameGhost) {
        animations.push(
          nameGhost.animate(
            [{ opacity: 1 }, { opacity: 0 }],
            { duration: CONTENT_IN_DURATION, delay: 60, easing: FOCUS_EASE, fill: 'forwards' }
          )
        );
      }
      card._swapAnimations = animations;

      Promise.all(animations.map((animation) => animation.finished.catch(() => {}))).then(() => {
        if (card.dataset.swap !== token) return;
        swapLayer.style.removeProperty('opacity');
        card.classList.remove('animate-pick');
        if (nameGhost) nameGhost.remove();
        animations.forEach((animation) => animation.cancel());
        card._swapAnimations = [];
      });
    }

    function refreshCard(card, nextMap, colors) {
      const previous = card._map || {};
      const pickKey = (map) =>
        `${map.chosenBy || ''}|${map.chosenByLogo || ''}|${pickRgb(map, colors)}`;
      const pickChanged = pickKey(previous) !== pickKey(nextMap);
      const contentChanged =
        (previous.name || '') !== (nextMap.name || '') ||
        (previous.imageUrl || '') !== (nextMap.imageUrl || '') ||
        pickChanged;

      if (!contentChanged) {
        card._map = snapshot(nextMap);
        return;
      }

      animateCardSwap(
        card,
        (animations) => {
          const image = card.querySelector('.map-image');
          if (nextMap.imageUrl) {
            image.style.backgroundImage = `url('${nextMap.imageUrl}')`;
            image.style.removeProperty('background-color');
          } else {
            image.style.removeProperty('background-image');
            image.style.backgroundColor = 'var(--fgc-surface-muted)';
          }
          const text = card.querySelector('.map-name-text');
          if (text) text.textContent = nextMap.name;
          refreshPickedState(card, nextMap, colors, animations, pickChanged);
          card._map = snapshot(nextMap);
        },
        { pickChanged }
      );
    }

    function createColumn(modeName, maps, modeData, colors) {
      const column = document.createElement('div');
      column.className = 'map-column';
      column.dataset.mode = modeName;
      column.dataset.icons = JSON.stringify(modeData?.icons || []);
      column.innerHTML = createModeHeader(modeName, modeData);
      maps.forEach((map, index) => column.appendChild(createMapCard(map, colors, index)));
      return column;
    }

    function updateModeHeader(column, group) {
      const icons = JSON.stringify(group.modeIcons || []);
      if (column.dataset.icons === icons) return;
      column.dataset.icons = icons;
      const header = column.querySelector('.mode-header');
      if (header) header.outerHTML = createModeHeader(group.modeName, { icons: group.modeIcons });
    }

    function animateNodeIn(node, delaySeconds, fromY) {
      if (prefersReducedMotion()) return;
      const animation = node.animate(
        [
          { opacity: 0, transform: `translateY(${fromY}px)` },
          { opacity: 1, transform: 'translateY(0)' }
        ],
        {
          duration: 520,
          delay: Math.round(delaySeconds * 1000),
          easing: FOCUS_EASE,
          fill: 'forwards'
        }
      );
      animation.finished.then(() => animation.cancel(), () => {});
    }

    function findColumn(modeName) {
      return Array.from(el.mapPool.querySelectorAll('.map-column'))
        .find((column) => column.dataset.mode === modeName) || null;
    }

    function reconcilePool(sortedData, colors) {
      const wanted = new Set(
        sortedData.filter((group) => group.maps && group.maps.length).map((group) => group.modeName)
      );

      el.mapPool.querySelectorAll('.map-column').forEach((column) => {
        if (!wanted.has(column.dataset.mode)) column.remove();
      });

      const empty = el.mapPool.querySelector('.empty-pool');
      if (empty) empty.remove();

      sortedData.forEach((group, groupIndex) => {
        if (!group.maps || group.maps.length === 0) return;

        let column = findColumn(group.modeName);
        const isNewColumn = !column;
        if (isNewColumn) {
          column = createColumn(group.modeName, group.maps, { icons: group.modeIcons }, colors);
        } else {
          updateModeHeader(column, group);
        }

        const atIndex = el.mapPool.children[groupIndex] || null;
        if (el.mapPool.children[groupIndex] !== column) {
          el.mapPool.insertBefore(column, atIndex);
        }
        if (isNewColumn && openingSettled) {
          animateNodeIn(column, groupIndex * COLUMN_STAGGER_SECONDS, 32);
          column.querySelectorAll('.mode-icon, .mode-name').forEach((mark) => {
            animateNodeIn(mark, groupIndex * COLUMN_STAGGER_SECONDS + 0.18, -6);
          });
        }

        // Cards keep a stable slot identity, so a renamed map crossfades in
        // place instead of being torn down and rebuilt as a different card.
        const existing = new Map(
          Array.from(column.querySelectorAll('.map-card')).map((card) => [Number(card.dataset.slot), card])
        );

        existing.forEach((card, slot) => {
          if (slot >= group.maps.length) {
            cancelCardAnimations(card);
            card.remove();
          }
        });

        group.maps.forEach((map, cardIndex) => {
          let card = existing.get(cardIndex);
          if (!card) {
            card = createMapCard(map, colors, cardIndex);
            if (openingSettled) {
              animateNodeIn(card, cardIndex * CARD_STAGGER_SECONDS, 10);
            }
          } else {
            refreshCard(card, map, colors);
          }

          const cards = Array.from(column.querySelectorAll('.map-card'));
          if (cards[cardIndex] !== card) {
            column.insertBefore(card, cards[cardIndex] || null);
          }
        });
      });
    }

    function triggerAnimations() {
      if (openingSettled) return [];

      const columns = Array.from(el.mapPool.querySelectorAll('.map-column'));
      if (columns.length === 0) return [];

      columns.forEach((column, columnIndex) => {
        const columnDelay = `calc(var(--pool-anim-delay) + ${columnIndex * COLUMN_STAGGER_SECONDS}s)`;
        column.style.setProperty('--column-delay', columnDelay);
        column.classList.add('animate-column');
        column.querySelectorAll('.mode-icon, .mode-name').forEach((mark) => {
          mark.style.setProperty('--mode-delay', columnDelay);
          mark.classList.add('animate-mode');
        });
        column.querySelectorAll('.map-card').forEach((card, cardIndex) => {
          card.style.setProperty(
            '--card-delay',
            `calc(var(--pool-anim-delay) + ${columnIndex * COLUMN_STAGGER_SECONDS}s + ${cardIndex * CARD_STAGGER_SECONDS}s)`
          );
          card.classList.add('animate-card');
        });
      });

      return Array.from(el.mapPool.querySelectorAll('.animate-column, .animate-card, .animate-mode'))
        .flatMap((node) => node.getAnimations());
    }

    function settleOpening() {
      openingSettled = true;
      el.mapPool.querySelectorAll('.map-column').forEach((column) => {
        column.style.opacity = '1';
        column.style.transform = '';
      });
      el.mapPool.querySelectorAll('.animate-column, .animate-card, .animate-mode').forEach((node) => {
        node.getAnimations().forEach((animation) => animation.cancel());
        node.classList.remove('animate-column', 'animate-card', 'animate-mode');
        node.style.removeProperty('--column-delay');
        node.style.removeProperty('--card-delay');
        node.style.removeProperty('--mode-delay');
        node.style.opacity = '1';
        node.style.transform = '';
      });
    }

    function sortPoolData(poolData) {
      const flashpointPush = ['Flashpoint', 'Push'];
      const otherModes = [];
      const fpPushModes = [];

      for (const modeGroup of poolData) {
        if (flashpointPush.includes(modeGroup.modeName)) {
          fpPushModes.push(modeGroup);
        } else {
          otherModes.push(modeGroup);
        }
      }

      otherModes.sort((a, b) => a.modeName.localeCompare(b.modeName));
      fpPushModes.sort((a, b) => a.modeName.localeCompare(b.modeName));

      return [...otherModes, ...fpPushModes];
    }

    function updateMapPool() {
      if (!currentData) return;

      const poolData = currentData.mapPoolData;

      if (!poolData || poolData.length === 0) {
        renderedSignature = '';
        renderedPool = null;
        if (!emptyShown) {
          el.mapPool.innerHTML = '<div class="empty-pool">No maps in pool</div>';
          emptyShown = true;
        }
        // Keep the opening armed: an empty `init` frame can arrive before the
        // first real pool, and that pool should still reveal column by column.
        return;
      }

      emptyShown = false;
      const sortedData = sortPoolData(poolData);
      const colors = teamColors(currentData);
      const signature = poolSignature(sortedData, colors);

      if (signature === renderedSignature) return;

      const firstRender = renderedPool === null;
      if (!firstRender && !openingSettled) settleOpening();

      renderedSignature = signature;
      reconcilePool(sortedData, colors);
      renderedPool = snapshot(sortedData);

      if (firstRender) {
        const animations = triggerAnimations();
        if (animations.length === 0) {
          settleOpening();
        } else {
          Promise.all(animations.map((animation) => animation.finished.catch(() => {})))
            .then(settleOpening);
        }
      }
    }

    function connect() {
      // Reach the server that served this page so a LAN or proxied client does
      // not dial its own localhost. ?host= and ?port= still override the target
      // for third-party pages.
      const query = new URLSearchParams(location.search);
      const host = query.get('host');
      const port = query.get('port');
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      const target = host || port
        ? `${host || 'localhost'}:${port || '3001'}`
        : (location.host || 'localhost:3001');
      const ws = new WebSocket(`${scheme}://${target}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'requestInit' }));
      };

      ws.onmessage = ({ data }) => {
        try {
          updateOverlay(JSON.parse(data));
        } catch (e) {
          console.error('Parse error:', e);
        }
      };

      ws.onclose = () => {
        setTimeout(connect, 2000);
      };
      ws.onerror = (e) => console.error('WS error:', e);
    }

    // === OVERLAY THEME ===
    // The app sends the active theme as a `theme` message. Its  `tokens` are
    // the complete set of CSS custom properties to override, so a property
    // applied by an earlier theme and missing from this set is removed again.
    // That is what restores the stylesheet defaults when the theme changes.
    let appliedThemeTokens = [];

    function applyTheme(payload) {
      const tokens =
        payload && typeof payload === 'object' && payload.tokens && typeof payload.tokens === 'object'
          ? payload.tokens
          : {};
      const root = document.documentElement;
      appliedThemeTokens.forEach((name) => {
        if (!Object.prototype.hasOwnProperty.call(tokens, name)) root.style.removeProperty(name);
      });
      appliedThemeTokens = Object.keys(tokens);
      appliedThemeTokens.forEach((name) => {
        root.style.setProperty(name, String(tokens[name]));
      });
    }

    function updateOverlay(data) {
      if (window.fgcUpdateBackground) window.fgcUpdateBackground(data);
      const d = data.data || data;
      if (data.type === 'theme') {
        applyTheme(d);
        return;
      }
      if (data.type === 'init' && d.theme) {
        applyTheme(d.theme);
      }

      if (data.type === 'init') {
        // The keyed init frame wraps the scoreboard, so unwrap it before the
        // pool read. Otherwise teamA/teamB colours fall back to orange.
        const scoreboard = d.scoreboard || d;
        const mapPoolData = scoreboard.mapPoolData || d.mapPoolData;
        if (mapPoolData && mapPoolData.length > 0) {
          return updateOverlay({ type: 'mapPool', data: { ...scoreboard, mapPoolData } });
        }
        return;
      }

      if (data.type === 'scoreboard' || data.type === 'mapPool') {
        currentData = d;

        if (d.gameModeIcons) {
          gameModeIcons = d.gameModeIcons;
        }

        updateMapPool();
      }

      if (data.type === 'show') {
        el.overlay.style.display = data.visible ? 'block' : 'none';
      }
    }

    connect();
  </script>
</body>
</html>
