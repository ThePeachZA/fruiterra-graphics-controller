<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <link rel="icon" href="data:,">
  <title>Timer Overlay</title>
  <style>
    @font-face {
      font-family: 'FGC Display SemiBold';
      font-weight: 600;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-600.woff2') format('woff2');
    }

    /* === NIGHT BROADCAST TOKENS ===
       Shared design tokens for the Fruiterra overlay refresh. Each overlay
       inlines this block, exactly as it inlines its own font faces. */
    :root {
      --fgc-canvas: transparent;

      --fgc-surface: #0b0d12;
      --fgc-surface-raised: #11151d;
      --fgc-surface-inverse: #eef2f8;
      --fgc-surface-muted: #151922;

      --fgc-line: #2a3140;
      --fgc-line-strong: #3a4356;
      --fgc-line-on-inverse: #0b0d12;

      --fgc-text: #eef2f8;
      --fgc-text-muted: #8d99ad;
      --fgc-text-faint: #6b7688;
      --fgc-text-inverse: #0b0d12;

      --fgc-accent: #ff7a1a;
      --fgc-accent-strong: #ff9346;
      --fgc-accent-soft: rgb(255 122 26 / 16%);
      --fgc-on-accent: #0b0d12;

      --fgc-success: #3ecf8e;
      --fgc-warning: #f5b84b;
      --fgc-danger: #ef5b5b;

      --fgc-space-1: 4px;
      --fgc-space-2: 8px;
      --fgc-space-3: 12px;
      --fgc-space-4: 16px;
      --fgc-radius-sm: 4px;
      --fgc-radius-md: 6px;
      --fgc-radius-lg: 10px;
      --fgc-radius-pill: 999px;
      --fgc-margin: 43px;

      --fgc-duration-micro: 120ms;
      --fgc-duration-state: 240ms;
      --fgc-duration-reveal: 480ms;
      --fgc-duration-scene: 900ms;
      --fgc-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    .fgc-timer {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 0 96px;
    }

    .fgc-timer[data-align="left"] {
      justify-content: flex-start;
    }

    .fgc-timer[data-align="right"] {
      justify-content: flex-end;
    }

    .fgc-timer__value {
      color: var(--fgc-text);
      font-family: 'FGC Display SemiBold', 'Apotek Semibold', Arial, sans-serif;
      font-size: 160px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65);
    }

    .fgc-timer--hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="fgc-timer" id="timer-root" data-align="center">
    <div class="fgc-timer__value" id="timer-value" role="timer" aria-live="off">00:00:00</div>
  </div>

  <script>
    (function () {
      'use strict';

      const query = new URLSearchParams(location.search);
      const root = document.getElementById('timer-root');
      const value = document.getElementById('timer-value');
      let lastSettings = {};

      function nonNegativeInteger(input) {
        const number = Number(input);
        return Number.isFinite(number) ? Math.max(0, Math.floor(number)) : 0;
      }

      function formatPart(number, pad) {
        return pad ? String(number).padStart(2, '0') : String(number);
      }

      function renderTimer(data) {
        if (!data || typeof data !== 'object') return;

        if (data.settings && typeof data.settings === 'object') lastSettings = data.settings;
        const settings = lastSettings;
        const pad = settings.leadingZeroes !== false;
        const showHours = settings.showHours !== false;
        const alignment = settings.alignment;

        root.dataset.align = alignment === 'left' || alignment === 'right' ? alignment : 'center';
        const hours = nonNegativeInteger(data.hours);
        const minutes = nonNegativeInteger(data.minutes);
        const parts = showHours ? [hours, minutes] : [hours * 60 + minutes];
        parts.push(nonNegativeInteger(data.seconds));
        value.textContent = parts.map((part) => formatPart(part, pad)).join(':');
      }

      // === OVERLAY THEME ===
      // The app sends the active theme as a 	heme message. Its 	okens are
      // the complete set of CSS custom properties to override, so a property
      // applied by an earlier theme and missing from this set is removed again.
      // That is what restores the stylesheet defaults when the theme changes.
      let appliedThemeTokens = [];

      function applyTheme(payload) {
        const tokens =
          payload && typeof payload === 'object' && payload.tokens && typeof payload.tokens === 'object'
            ? payload.tokens
            : {};
        const root = document.documentElement;
        appliedThemeTokens.forEach((name) => {
          if (!Object.prototype.hasOwnProperty.call(tokens, name)) root.style.removeProperty(name);
        });
        appliedThemeTokens = Object.keys(tokens);
        appliedThemeTokens.forEach((name) => {
          root.style.setProperty(name, String(tokens[name]));
        });
      }
      function handleMessage(message) {
        if (!message || typeof message !== 'object') return;

        if (message.type === 'theme') {
          applyTheme(message.data);
          return;
        }
        if (message.type === 'init' && message.data && message.data.theme) {
          applyTheme(message.data.theme);
        }


        if (message.type === 'init') {
          const timer = message.data && message.data.matchTimer;
          if (timer && typeof timer === 'object' && !timer.action) renderTimer(timer);
          return;
        }
        if (message.type === 'matchTimer') {
          if (
            message.data &&
            typeof message.data === 'object' &&
            (!message.data.action || message.data.action === 'reset')
          ) {
            renderTimer(message.data);
          }
          return;
        }
        if (message.type === 'show' && typeof message.visible === 'boolean') {
          root.classList.toggle('fgc-timer--hidden', !message.visible);
        }
      }

      function connect() {
        const host = query.get('host');
        const port = query.get('port');
        const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
        const target = host || port
          ? `${host || 'localhost'}:${port || '3001'}`
          : (location.host || 'localhost:3001');
        const ws = new WebSocket(`${scheme}://${target}`);

        ws.onopen = () => ws.send(JSON.stringify({ type: 'requestInit' }));
        ws.onmessage = ({ data }) => {
          try {
            handleMessage(JSON.parse(data));
          } catch (error) {
            console.error('Timer overlay parse error:', error);
          }
        };
        ws.onclose = () => setTimeout(connect, 2000);
        ws.onerror = (error) => console.error('Timer overlay WS error:', error);
      }

      connect();
    })();
  </script>
</body>
</html>
