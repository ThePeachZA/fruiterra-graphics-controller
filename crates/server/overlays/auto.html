<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <link rel="icon" href="data:,">
  <title>Auto Overlay</title>
  <style>
    /* Critical document guard: contain overscanned FX/lattice layers during load so transient scrollbars never appear. */
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    .fgc-auto {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .fgc-auto__scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      background: transparent;
      transition: opacity 600ms ease, visibility 0s linear 600ms;
    }

    .fgc-auto__scene[data-visible="true"] {
      opacity: 1;
      visibility: visible;
      transition: opacity 600ms ease, visibility 0s;
    }
  </style>
</head>
<body>
  <div class="fgc-auto" id="auto-root" data-transition="idle"></div>

  <script>
    const OVERLAYS = Object.freeze([
      'game-overlay.html',
      'map-select.html',
      'hero-bans.html',
      'map-pool.html',
      'team-roster-home.html',
      'team-roster-away.html',
      'row-casters.html',
      'row-hosts.html',
      'row-interviews.html'
    ]);
    const ALLOWED = new Set(OVERLAYS);
    const SCENE_FADE_MS = 600;
    const query = new URLSearchParams(location.search);
    const root = document.getElementById('auto-root');
    const frames = new Map();
    let included = [];
    let active = null;
    let visible = true;
    let displayed = null;
    let fadeTimer = 0;

    function sceneUrl(file) {
      const params = new URLSearchParams();
      const host = query.get('host');
      const port = query.get('port');
      const bg = query.get('bg');
      if (host) params.set('host', host);
      if (port) params.set('port', port);
      // The app-level background toggle lives on the auto URL too, so every
      // scene frame inherits the same mode without a second toggle.
      if (bg === 'opaque' || bg === 'transparent' || bg === 'on' || bg === 'off') {
        params.set('bg', bg);
      }
      const suffix = params.toString();
      return `./${file}${suffix ? `?${suffix}` : ''}`;
    }

    function ensureFrame(file) {
      let frame = frames.get(file);
      if (frame) return frame;

      frame = document.createElement('iframe');
      frame.className = 'fgc-auto__scene';
      frame.title = file;
      frame.src = sceneUrl(file);
      root.appendChild(frame);
      frames.set(file, frame);
      return frame;
    }

    function replaceFrame(file) {
      const previous = frames.get(file);
      if (previous) {
        previous.remove();
        frames.delete(file);
      }
      return ensureFrame(file);
    }

    function applySelection() {
      const includedSet = new Set(included);
      const safeActive = includedSet.has(active) ? active : null;
      const target = visible && safeActive ? safeActive : null;

      if (displayed === target) return;
      displayed = target;

      // A fresh frame gives the incoming overlay its own init frame, so its
      // opening animations replay on every activation rather than only once.
      const incoming = target ? replaceFrame(target) : null;

      // The new frame starts from the hidden style and is promoted on the next
      // paint, so both the outgoing and incoming scenes animate for 600ms.
      for (const frame of frames.values()) {
        frame.dataset.visible = 'false';
      }
      if (incoming) {
        // Flush the hidden style before promoting the frame, otherwise the
        // browser can coalesce both states and skip the opacity transition.
        void incoming.offsetWidth;
        requestAnimationFrame(() => {
          incoming.dataset.visible = 'true';
        });
      }

      root.dataset.transition = 'fade';
      clearTimeout(fadeTimer);
      fadeTimer = setTimeout(() => {
        root.dataset.transition = 'idle';
        // Retire every frame except the live one. Switching back later creates
        // a new frame and therefore replays that overlay's reveal animations.
        for (const [file, frame] of frames) {
          if (file === displayed) continue;
          frame.remove();
          frames.delete(file);
        }
      }, SCENE_FADE_MS);
    }

    function updateSelection(data) {
      const requested = Array.isArray(data && data.included)
        ? data.included.filter((file) => typeof file === 'string' && ALLOWED.has(file))
        : [];
      const requestedSet = new Set(requested);
      included = OVERLAYS.filter((file) => requestedSet.has(file));

      const candidate = data && data.active;
      active = typeof candidate === 'string' && included.includes(candidate) ? candidate : null;
      applySelection();
    }

    // === OVERLAY THEME ===
    // The app sends the active theme as a `theme` message. Its  `tokens` are
    // the complete set of CSS custom properties to override, so a property
    // applied by an earlier theme and missing from this set is removed again.
    // That is what restores the stylesheet defaults when the theme changes.
    let appliedThemeTokens = [];

    function applyTheme(payload) {
      const tokens =
        payload && typeof payload === 'object' && payload.tokens && typeof payload.tokens === 'object'
          ? payload.tokens
          : {};
      const root = document.documentElement;
      appliedThemeTokens.forEach((name) => {
        if (!Object.prototype.hasOwnProperty.call(tokens, name)) root.style.removeProperty(name);
      });
      appliedThemeTokens = Object.keys(tokens);
      appliedThemeTokens.forEach((name) => {
        root.style.setProperty(name, String(tokens[name]));
      });
    }
    function handleMessage(message) {
      if (!message || typeof message !== 'object') return;

      if (message.type === 'theme') {
        applyTheme(message.data);
        return;
      }
      if (message.type === 'init' && message.data && message.data.theme) {
        applyTheme(message.data.theme);
      }


      if (message.type === 'init' && message.data && message.data.autoOverlay) {
        updateSelection(message.data.autoOverlay);
        return;
      }
      if (message.type === 'autoOverlay') {
        updateSelection(message.data);
        return;
      }
      if (message.type === 'show' && typeof message.visible === 'boolean') {
        visible = message.visible;
        applySelection();
      }
    }

    function connect() {
      const host = query.get('host');
      const port = query.get('port');
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      const target = host || port
        ? `${host || 'localhost'}:${port || '3001'}`
        : (location.host || 'localhost:3001');
      const ws = new WebSocket(`${scheme}://${target}`);

      ws.onopen = () => ws.send(JSON.stringify({ type: 'requestInit' }));
      ws.onmessage = ({ data }) => {
        try {
          handleMessage(JSON.parse(data));
        } catch (error) {
          console.error('Auto overlay parse error:', error);
        }
      };
      ws.onclose = () => setTimeout(connect, 2000);
      ws.onerror = (error) => console.error('Auto overlay WS error:', error);
    }

    connect();
  </script>
</body>
</html>
