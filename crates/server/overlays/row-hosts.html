<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">

  <title>Hosts and Analysts</title>
  <style>
    /* Critical document guard: contain overscanned FX/lattice layers during load so transient scrollbars never appear. */
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    @font-face {
      font-family: 'FGC Display Light';
      font-weight: 300;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-300.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display';
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-400.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display Medium';
      font-weight: 500;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-500.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display SemiBold';
      font-weight: 600;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-600.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display Black';
      font-weight: 900;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-900.woff2') format('woff2');
    }

    /* === NIGHT BROADCAST TOKENS ===
       Shared design tokens for the Fruiterra overlay refresh. Each overlay
       inlines this block, exactly as it inlines its own font faces. */
    :root {
      --fgc-canvas: transparent;

      --fgc-surface: #0b0d12;
      --fgc-surface-raised: #11151d;
      --fgc-surface-inverse: #eef2f8;
      --fgc-surface-muted: #151922;

      --fgc-line: #2a3140;
      --fgc-line-strong: #3a4356;
      --fgc-line-on-inverse: #0b0d12;

      --fgc-text: #eef2f8;
      --fgc-text-muted: #8d99ad;
      --fgc-text-faint: #6b7688;
      --fgc-text-inverse: #0b0d12;

      --fgc-accent: #ff7a1a;
      --fgc-accent-strong: #ff9346;
      --fgc-accent-soft: rgb(255 122 26 / 16%);
      --fgc-on-accent: #0b0d12;

      --fgc-success: #3ecf8e;
      --fgc-warning: #f5b84b;
      --fgc-danger: #ef5b5b;

      --fgc-space-1: 4px;
      --fgc-space-2: 8px;
      --fgc-space-3: 12px;
      --fgc-space-4: 16px;
      --fgc-radius-sm: 4px;
      --fgc-radius-md: 6px;
      --fgc-radius-lg: 10px;
      --fgc-radius-pill: 999px;
      --fgc-margin: 43px;

      --fgc-duration-micro: 120ms;
      --fgc-duration-state: 240ms;
      --fgc-duration-reveal: 480ms;
      --fgc-duration-scene: 900ms;
      --fgc-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'FGC Display', 'Apotek', sans-serif;
      background: transparent;
    }

    .overlay {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    .main-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 100px;
    }

    /* Talent row */
    .talent-container {
      display: flex;
      gap: 20px;
      height: 800px;
      width: 100%;
      max-width: 1720px;
    }

    .talent-container.single-talent {
      max-width: 900px;
    }

    /* A card is a portrait stage. The photograph stays unobstructed: no frame,
       wash, or gradient paints on top of it. */
    .caster-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-radius: var(--fgc-radius-lg);
      overflow: hidden;
      max-width: none;
      background: var(--fgc-surface);
      clip-path: inset(0 round var(--fgc-radius-lg));
      box-shadow: 0 24px 64px rgb(0 0 0 / 32%);
    }

    .talent-media {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: var(--fgc-surface-muted);
    }

    .talent-image {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .talent-image:not([src]),
    .talent-image[src=""] {
      display: none;
    }

    /* A transparent portrait keeps its own subject box; the image is sized and
       centred on that box rather than on unused canvas pixels. */
    .talent-image.portrait--cutout {
      object-fit: contain;
    }

    .talent-text {
      position: relative;
      z-index: 5;
      flex: 0 0 auto;
      min-height: 156px;
      padding: 18px 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(180deg, var(--fgc-surface-raised), var(--fgc-surface));
      border-top: 1px solid color-mix(in srgb, var(--fgc-accent) 32%, var(--fgc-line));
    }

    .talent-name {
      width: 100%;
      font-family: 'FGC Display Medium', 'Apotek Medium', sans-serif;
      font-size: 44px;
      line-height: 1.02;
      color: var(--fgc-text);
      text-transform: uppercase;
      text-align: center;
    }

    .talent-subtext {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 100%;
      min-width: 0;
    }

    .social-icon {
      flex: 0 0 22px;
      width: 22px;
      height: 22px;
    }

    .social-icon svg {
      width: 100%;
      height: 100%;
    }

    /* Social icons are neutral metadata, so they take the muted text tier. */
    .social-icon path {
      fill: var(--fgc-text-muted);
    }

    .social-handle {
      font-family: 'FGC Display Light', 'Apotek Light', sans-serif;
      font-size: 22px;
      color: var(--fgc-text-muted);
    }

    .separator {
      flex: 0 0 auto;
      font-family: 'FGC Display Light', 'Apotek Light', sans-serif;
      font-size: 22px;
      color: var(--fgc-text-muted);
    }

    .pronouns {
      font-family: 'FGC Display Light', 'Apotek Light', sans-serif;
      font-size: 22px;
      color: var(--fgc-text-muted);
    }

    .social-handle,
    .pronouns {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @keyframes talentCardReveal {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes talentContentReveal {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .caster-card.animate-card {
      animation: talentCardReveal 620ms var(--fgc-ease-out) both;
      animation-delay: var(--card-delay, 0ms);
    }

    .caster-card.animate-card .talent-text > * {
      animation: talentContentReveal 480ms var(--fgc-ease-out) both;
      animation-delay: calc(var(--card-delay, 0ms) + 140ms);
    }

    .caster-card.animate-card .talent-text > :nth-child(2) {
      animation-delay: calc(var(--card-delay, 0ms) + 200ms);
    }

    @media (prefers-reduced-motion: reduce) {
      .caster-card.animate-card,
      .caster-card.animate-card .talent-text > * {
        animation: none !important;
      }
    }

    .hidden {
      display: none !important;
    }
  </style>
  <!-- === FGC CANONICAL FX START === -->
  <style>
    :root {
      --fgc-hex-mask: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' width='56' height='100' viewBox='0 0 56 100'%3E%3Cpath d='M28 66L0 50L0 16L28 0L56 16L56 50L28 66L28 100L0 84L0 50L28 34L56 50L56 84L28 100' fill='none' stroke='%23ffffff' stroke-width='1'/%3E%3C/svg%3E");
    }

    /* The mask repeats every 180x322 px, so exactly one tile of travel lands
       on an identical frame. Keeping the colour uniform is part of that seam:
       a non-repeating gradient would move even though the lattice re-aligned. */
    @keyframes fgcCanonicalFxDrift {
      from { transform: translate3d(0, -322px, 0); }
      to { transform: translate3d(180px, 0, 0); }
    }

    /* The FX siblings come first; the existing roots stay above them without
       changing their geometry, colours or layout. */
    .overlay {
      z-index: 1;
    }

    /* Opaque mode is one plain plate taken from the theme. The lattice stays
       on top of it, so both modes carry the hexagon display. */
    .fgc-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      display: none;
      background-color: var(--fgc-surface);
    }

    .fgc-fx {
      position: absolute;
      /* More than one tile on every side, including the travel at both ends. */
      inset: -360px;
      z-index: 0;
      pointer-events: none;
      background-color: var(--fgc-line-strong);
      opacity: 0.16;
      -webkit-mask-image: var(--fgc-hex-mask);
      mask-image: var(--fgc-hex-mask);
      -webkit-mask-size: 180px 322px;
      mask-size: 180px 322px;
      -webkit-mask-repeat: repeat;
      mask-repeat: repeat;
      -webkit-mask-position: center;
      mask-position: center;
      transform: translate3d(0, -322px, 0);
      animation: fgcCanonicalFxDrift 72s linear infinite;
      /* Only this compositor drift changes every frame; the mask never repaints. */
      will-change: transform;
    }

    html[data-fx="off"] .fgc-fx {
      display: none;
    }

    html[data-bg="opaque"] .fgc-bg {
      display: block;
    }


    /* Reduced motion freezes the drift but keeps the static lattice. */
    @media (prefers-reduced-motion: reduce) {
      .fgc-fx {
        animation: none;
      }
    }
  </style>
  <script>
    (() => {
      const query = new URLSearchParams(location.search);
      const root = document.documentElement;

      const requestedFx = query.get('fx');
      if (requestedFx === 'on' || requestedFx === 'off') {
        root.dataset.fx = requestedFx;
      } else if (root.dataset.fx !== 'off') {
        root.dataset.fx = 'on';
      }

      // Opaque is the default; transparent turns it back on. The short aliases
      // read naturally in a Browser Source URL. A document-level data-bg
      // attribute lets a host page override that default.
      const requestedBg = query.get('bg');
      const bgMode =
        requestedBg === 'off' ? 'opaque' :
        requestedBg === 'on' ? 'transparent' :
        requestedBg;
      if (bgMode === 'opaque' || bgMode === 'transparent') {
        root.dataset.bg = bgMode;
      } else if (root.dataset.bg !== 'opaque' && root.dataset.bg !== 'transparent') {
        root.dataset.bg = 'opaque';
      }

      // A cached section message lets the app switch every connected source
      // without an OBS refresh. It also arrives inside the keyed init frame
      // when a source refreshes, so the URL is only the starting state.
      window.fgcUpdateBackground = (data) => {
        const payload = data && typeof data === 'object' ? (data.data || data) : null;
        const section = payload && payload.background && typeof payload.background === 'object'
          ? payload.background
          : null;
        const candidate = section || payload;
        const opaque = candidate && typeof candidate.opaque === 'boolean' ? candidate.opaque : null;
        if (opaque !== null) {
          root.dataset.bg = opaque ? 'opaque' : 'transparent';
        }
      };
    })();
  </script>
  <!-- === FGC CANONICAL FX END === -->
</head>
<body>

  <script>
    // Escape user-supplied text before interpolating it into innerHTML.
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      })[character]);
    }

    // Shrink text until it fits on one line, then ellipsize at the floor size.
    function fitText(target, maxSize, minSize) {
      if (!target) return;
      target.style.whiteSpace = 'nowrap';
      target.style.overflow = 'hidden';
      target.style.textOverflow = 'ellipsis';

      const style = getComputedStyle(target);
      const available = target.clientWidth
        - parseFloat(style.paddingLeft)
        - parseFloat(style.paddingRight);
      if (!(available > 0)) return;

      // Ancestors animate with a transform, so convert the measured range
      // back into layout pixels before comparing it with the layout width.
      const measure = () => {
        const range = document.createRange();
        range.selectNodeContents(target);
        const scale = target.offsetWidth
          ? target.getBoundingClientRect().width / target.offsetWidth
          : 1;
        return scale > 0 ? range.getBoundingClientRect().width / scale : 0;
      };

      let size = maxSize;
      target.style.fontSize = `${size}px`;
      while (size > minSize && measure() > available) {
        size -= 1;
        target.style.fontSize = `${size}px`;
      }
    }

      el.talentContainer.querySelectorAll('.talent-name').forEach((name) => {

    function getSocialIcon(platform) {
      switch (platform) {
        case 'twitter':
          return getTwitterIcon();
        case 'twitch':
          return getTwitchIcon();
        case 'youtube':
          return getYoutubeIcon();
        case 'instagram':

        case 'tiktok':
          return getTiktokIcon();
        default:

      }

    // This overlay is the studio desk, so it only renders the talent
    // assigned as a host or an analyst. Casters and the interview have their
    // own overlays.
    const ACCEPTED_ROLES = ['host', 'analyst'];
    // A transparent portrait carries useful pixels only in part of its canvas.
    // Locate that subject once so the card can centre the person instead of the
    // empty margin. Opaque or tainted images simply keep the cover treatment.
    function subjectBox(img) {
      const width = img.naturalWidth;
      const height = img.naturalHeight;
      if (!width || !height) return null;

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d', { willReadFrequently: true });
      if (!context) return null;

      let pixels;
      try {
        context.clearRect(0, 0, width, height);
        context.drawImage(img, 0, 0);
        pixels = context.getImageData(0, 0, width, height).data;
      } catch (error) {
        return null;
      }

      let minX = width;
      let minY = height;
      let maxX = -1;
      let maxY = -1;
      for (let y = 0; y < height; y += 1) {
        for (let x = 0; x < width; x += 1) {
          if (pixels[(y * width + x) * 4 + 3] > 8) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0 || maxY < 0) return null;
      return { x: minX, y: minY, width: maxX - minX + 1, height: maxY - minY + 1 };
    }

    function fitPortrait(img) {
      if (!img || !img.complete || !img.naturalWidth) return;
      const media = img.parentElement;
      const subject = subjectBox(img);
      const coverage = subject
        ? (subject.width * subject.height) / (img.naturalWidth * img.naturalHeight)
        : 1;
      if (!subject || coverage > 0.82 || media.clientWidth <= 56 || media.clientHeight <= 42) {
        img.classList.remove('portrait--cutout');
        img.style.width = '';
        img.style.height = '';
        img.style.left = '';
        img.style.top = '';
        return;
      }

      const scale = Math.min(
        (media.clientWidth - 56) / subject.width,
        (media.clientHeight - 42) / subject.height
      );
      const centreX = subject.x + subject.width / 2;
      const centreY = subject.y + subject.height / 2;
      img.classList.add('portrait--cutout');
      img.style.width = `${img.naturalWidth * scale}px`;
      img.style.height = `${img.naturalHeight * scale}px`;
      img.style.left = `${media.clientWidth / 2 - centreX * scale}px`;
      img.style.top = `${media.clientHeight / 2 - centreY * scale}px`;
    }

    // Cards are keyed by slot. A repeated frame leaves every card untouched,
    // and a changed frame animates only the slots whose visible data moved.
    const renderedCards = new Map();
    let openingPlayed = false;
    let openingSettled = false;
    let overlayVisible = true;
    const LOAD_IN_START_DELAY = 500;

    function cardSignature(item) {
      const entry = item.entry;
      const social = entry.socialMedia || {};
      return [
        item.slot,
        entry.displayName || '',
        entry.portraitUrl || '',
        social.platform || '',
        social.handle || '',
        entry.pronouns || '',
      ].join('|');
    }

    function createCard() {
      const card = document.createElement('div');
      card.className = 'caster-card';
      card.innerHTML = `
        <div class="talent-media">
          <img class="talent-image" alt="" />
        </div>
        <div class="talent-text">
          <div class="talent-name"></div>
          <div class="talent-subtext hidden"></div>
        </div>
      `;
      const img = card.querySelector('.talent-image');
      img.addEventListener('load', () => fitPortrait(img));
      return card;
    }

    function applyCardContent(card, item) {
      const entry = item.entry;
      const signature = cardSignature(item);
      if (card.dataset.signature === signature) return false;

      card.querySelector('.talent-name').textContent = entry.displayName || 'TALENT NAME';

      const social = entry.socialMedia || {};
      const socialIconSvg = social.platform ? getSocialIcon(social.platform) : '';
      const socialIcon = socialIconSvg ? `<div class="social-icon">${socialIconSvg}</div>` : '';
      const handle = String(social.handle ?? '').trim();
      const displayHandle = handle.startsWith('@') ? handle : `@${handle}`;
      const socialHandle = handle
        ? `<span class="social-handle" title="${escapeHtml(displayHandle)}">${escapeHtml(displayHandle)}</span>`
        : '';
      const separator = (socialIcon || socialHandle) && entry.pronouns
        ? '<span class="separator">|</span>'
        : '';
      const pronouns = entry.pronouns
        ? `<span class="pronouns">${escapeHtml(entry.pronouns)}</span>`
        : '';
      const parts = [socialIcon, socialHandle, separator, pronouns].filter(Boolean);
      const subtext = card.querySelector('.talent-subtext');
      subtext.innerHTML = parts.join('');
      subtext.classList.toggle('hidden', parts.length === 0);

      const img = card.querySelector('.talent-image');
      const source = entry.portraitUrl || '';
      if (source) {
        if (img.getAttribute('src') !== source) img.src = source;
      } else if (img.hasAttribute('src')) {
        img.removeAttribute('src');
        img.classList.remove('portrait--cutout');
        img.style.width = '';
        img.style.height = '';
        img.style.left = '';
        img.style.top = '';
      }

      card.dataset.slot = item.slot;
      card.dataset.signature = signature;
      fitPortrait(img);
      return true;
    }

    function prefersReducedMotion() {
      return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    function animateCard(card, delay) {
      if (prefersReducedMotion()) return;
      if (card.__fgcAnimationTimer) {
        window.clearTimeout(card.__fgcAnimationTimer);
        card.__fgcAnimationTimer = null;
      }
      card.classList.remove('animate-card');
      void card.offsetWidth;
      card.style.setProperty('--card-delay', `${delay}ms`);
      card.classList.add('animate-card');
      card.__fgcAnimationTimer = window.setTimeout(() => {
        card.classList.remove('animate-card');
        card.style.removeProperty('--card-delay');
        card.__fgcAnimationTimer = null;
      }, 900 + delay);
    }

    function replayLoadIn(startDelay = 0) {
      [...renderedCards.values()].forEach((card, index) => animateCard(card, startDelay + index * 110));
    }

    function syncCards(items) {
      const active = new Set(items.map((item) => item.slot));
      const changed = [];

      items.forEach((item, index) => {
        let card = renderedCards.get(item.slot);
        if (!card) {
          card = createCard();
          renderedCards.set(item.slot, card);
          el.talentContainer.appendChild(card);
        }
        if (applyCardContent(card, item)) changed.push(card);
      });

      renderedCards.forEach((card, slot) => {
        if (!active.has(slot)) {
          card.remove();
          renderedCards.delete(slot);
        }
      });

      items.forEach((item, index) => {
        const card = renderedCards.get(item.slot);
        if (card && el.talentContainer.children[index] !== card) {
          el.talentContainer.insertBefore(card, el.talentContainer.children[index] || null);
        }
      });

      el.talentContainer.classList.toggle('single-talent', items.length === 1);
      document.fonts.ready.then(fitTalentNames);

      if (items.length && !openingPlayed) {
        openingPlayed = true;
        replayLoadIn(LOAD_IN_START_DELAY);
        window.setTimeout(() => { openingSettled = true; }, LOAD_IN_START_DELAY + 1100 + items.length * 110);
      } else if (changed.length) {
        const startDelay = openingSettled ? 0 : LOAD_IN_START_DELAY;
        changed.forEach((card, index) => animateCard(card, startDelay + index * 90));
      }
    }

    function updateTalent() {
      const all = currentData?.castersData || currentData?.casters?.castersData || [];
      const talents = all
        .filter((entry) => entry && ACCEPTED_ROLES.includes(entry.role))
        .map((entry, index) => ({
          slot: `talent:${index}`,
          entry,
        }));
      syncCards(talents);
    }

    function connect() {
      // Reach the server that served this page so a LAN or proxied client does
      // not dial its own localhost. ?host= and ?port= still override the target
      // for third-party pages.
      const query = new URLSearchParams(location.search);
      const host = query.get('host');
      const port = query.get('port');
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      const target = host || port
        ? `${host || 'localhost'}:${port || '3001'}`
        : (location.host || 'localhost:3001');
      ws = new WebSocket(`${scheme}://${target}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'requestInit' }));
      };

      ws.onmessage = ({ data }) => {
        try {
          updateOverlay(JSON.parse(data));
        } catch (e) {
          console.error('Parse error:', e);
        }
      };

      ws.onclose = () => setTimeout(connect, 2000);
      ws.onerror = (e) => console.error('WS error:', e);
    }

    // === OVERLAY THEME ===
    // The app sends the active theme as a `theme` message. Its  `tokens` are
    // the complete set of CSS custom properties to override, so a property
    // applied by an earlier theme and missing from this set is removed again.
    // That is what restores the stylesheet defaults when the theme changes.
    let appliedThemeTokens = [];

    function applyTheme(payload) {
      const tokens =
        payload && typeof payload === 'object' && payload.tokens && typeof payload.tokens === 'object'
          ? payload.tokens
          : {};
      const root = document.documentElement;
      appliedThemeTokens.forEach((name) => {
        if (!Object.prototype.hasOwnProperty.call(tokens, name)) root.style.removeProperty(name);
      });
      appliedThemeTokens = Object.keys(tokens);
      appliedThemeTokens.forEach((name) => {
        root.style.setProperty(name, String(tokens[name]));
      });
    }
    function updateOverlay(data) {
      if (window.fgcUpdateBackground) window.fgcUpdateBackground(data);
      const d = data.data || data;
      if (data.type === 'theme') {
        applyTheme(d);
        return;
      }
      if (data.type === 'init' && d.theme) {
        applyTheme(d.theme);
      }


      // Only frames that carry the talent list update the desk; `show` frames
      // and the other sections must not clear it.
      if (Array.isArray(d?.castersData) || Array.isArray(d?.casters?.castersData)) {
        currentData = d;
        updateTalent();
      }

      if (data.type === 'show') {
        const visible = Boolean(data.visible);
        const wasVisible = overlayVisible;
        overlayVisible = visible;
        el.overlay.style.display = visible ? 'block' : 'none';
        if (visible && !wasVisible) replayLoadIn();
      }
    }

    document.fonts.ready.then(fitTalentNames);
    connect();
  </script>
</body>
</html>
