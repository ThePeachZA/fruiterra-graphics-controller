<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <link rel="icon" href="data:,">
  <title>Hero Bans</title>
  <style>
    @font-face {
      font-family: 'FGC Display Light';
      font-weight: 300;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-300.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display';
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-400.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display Medium';
      font-weight: 500;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-500.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display SemiBold';
      font-weight: 600;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-600.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display Black';
      font-weight: 900;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-900.woff2') format('woff2');
    }

    /* === NIGHT BROADCAST TOKENS ===
       Shared design tokens for the Fruiterra overlay refresh. Each overlay
       inlines this block, exactly as it inlines its own font faces. */
    :root {
      --fgc-canvas: transparent;

      --fgc-surface: #0b0d12;
      --fgc-surface-raised: #11151d;
      --fgc-surface-inverse: #eef2f8;
      --fgc-surface-muted: #151922;

      --fgc-line: #2a3140;
      --fgc-line-strong: #3a4356;
      --fgc-line-on-inverse: #0b0d12;

      --fgc-text: #eef2f8;
      --fgc-text-muted: #8d99ad;
      --fgc-text-faint: #6b7688;
      --fgc-text-inverse: #0b0d12;

      --fgc-accent: #ff7a1a;
      --fgc-accent-strong: #ff9346;
      --fgc-accent-soft: rgb(255 122 26 / 16%);
      --fgc-on-accent: #0b0d12;

      --fgc-success: #3ecf8e;
      --fgc-warning: #f5b84b;
      --fgc-danger: #ef5b5b;

      --fgc-space-1: 4px;
      --fgc-space-2: 8px;
      --fgc-space-3: 12px;
      --fgc-space-4: 16px;
      --fgc-radius-sm: 4px;
      --fgc-radius-md: 6px;
      --fgc-radius-lg: 10px;
      --fgc-radius-pill: 999px;
      --fgc-margin: 43px;

      --fgc-duration-micro: 120ms;
      --fgc-duration-state: 240ms;
      --fgc-duration-reveal: 480ms;
      --fgc-duration-scene: 900ms;
      --fgc-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'FGC Display', 'Apotek', sans-serif;
      background: transparent;
    }

    .overlay {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    /* === ANIMATIONS === */
    @keyframes fadeSlideDown {
      from {
        opacity: 0;
        transform: translateY(-50px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* === MAIN CONTAINER === */
    .main-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 200px;
      row-gap: 25px;
    }

    /* === HEADER === */
    .header {
      width: 100%;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .team-section {
      display: flex;
      align-items: stretch;
      border-radius: 6px;
      overflow: hidden;
      flex: 1;
    }

    .team-name {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      font-family: 'FGC Display Medium', 'Apotek Medium', sans-serif;
      font-size: 36px;
      color: var(--fgc-text);
      text-transform: uppercase;
      text-align: center;
      width: 100%;
      min-width: 200px;
    }

    .team-logo-container {
      width: 100px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .team-logo {
      width: 80px;
      height: 80px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .team-score {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'FGC Display SemiBold', 'Apotek Semibold', sans-serif;
      font-size: 48px;
      color: var(--fgc-text-inverse);
      text-transform: uppercase;
      background: var(--fgc-surface-inverse);
      flex-shrink: 0;
    }

    .first-to-section {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--fgc-surface);
      border-radius: 6px;
      padding: 0 25px;
      min-width: 196px;
      height: 80px;
    }

    .first-to-text {
      font-family: 'FGC Display SemiBold', 'Apotek Semibold', sans-serif;
      font-size: 36px;
      color: var(--fgc-text);
      text-transform: uppercase;
    }

    /* === HERO BAN PANELS === */
    .hero-bans-section {
      width: 100%;
      height: 630px;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 25px;
    }

    .hero-panel {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-radius: 6px;
      overflow: hidden;
      background: var(--fgc-surface);
    }

    .hero-panel__art {
      position: relative;
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--fgc-surface-muted);
    }

    .hero-panel__art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* The ordinal tag sits on the art, like the OWCS27 ban panels. */
    .hero-panel__tag {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 2;
      padding: 8px 16px;
      background: var(--fgc-surface-inverse);
      color: var(--fgc-text-inverse);
      font-family: 'FGC Display Medium', 'Apotek Medium', sans-serif;
      font-size: 20px;
      line-height: 1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: var(--fgc-radius-sm);
    }

    /* Extra bans for the same team are small portraits on the art corner, so a
       second ban is never dropped by the two-panel layout. */
    .hero-panel__extra {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 2;
      display: flex;
      gap: 10px;
    }

    .hero-panel__extra img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: var(--fgc-radius-sm);
      box-shadow: 0 4px 14px rgb(0 0 0 / 45%);
    }

    .hero-panel__band {
      height: 80px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      background: var(--fgc-surface);
    }

    .hero-panel__name {
      display: block;
      width: 100%;
      font-family: 'FGC Display Medium', 'Apotek Medium', sans-serif;
      font-size: 36px;
      color: var(--fgc-text);
      text-transform: uppercase;
      text-align: center;
    }

    /* === MAP STRIP === */
    .map-strip {
      width: 100%;
      height: 80px;
      display: flex;
      align-items: center;
      gap: 25px;
      padding: 0 25px;
      background: var(--fgc-surface);
      border-radius: 6px;
    }

    .map-strip__mode {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .map-strip__mode-icon {
      width: 40px;
      height: 40px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .map-strip__mode-text {
      font-family: 'FGC Display Medium', 'Apotek Medium', sans-serif;
      font-size: 24px;
      color: var(--fgc-accent);
      text-transform: uppercase;
    }

    .map-strip__index {
      font-family: 'FGC Display Medium', 'Apotek Medium', sans-serif;
      font-size: 24px;
      color: var(--fgc-text-muted);
      text-transform: uppercase;
    }

    .map-strip__name {
      display: block;
      flex: 1;
      text-align: right;
      font-family: 'FGC Display SemiBold', 'Apotek Semibold', sans-serif;
      font-size: 36px;
      color: var(--fgc-text);
      text-transform: uppercase;
    }

    /* === ICON VISIBILITY === */
    .icon-hidden {
      display: none !important;
    }
  </style>
</head>
<body>
    <div class="overlay">
    <!-- Main container -->
    <div class="main-container">
      <!-- Header -->
      <div class="header" id="header" style="opacity: 0;">
        <!-- Home Team -->
        <div class="team-section" id="home-section">
          <div class="team-name" id="home-name">HOME TEAM</div>
          <div class="team-logo-container">
            <div class="team-logo" id="home-logo"></div>
          </div>
          <div class="team-score" id="home-score">0</div>
        </div>

        <!-- First To -->
        <div class="first-to-section">
          <span class="first-to-text" id="first-to-text">FIRST TO 3</span>
        </div>

        <!-- Away Team -->
        <div class="team-section" id="away-section" style="flex-direction: row-reverse;">
          <div class="team-name" id="away-name">AWAY TEAM</div>
          <div class="team-logo-container">
            <div class="team-logo" id="away-logo"></div>
          </div>
          <div class="team-score" id="away-score">0</div>
        </div>
      </div>

      <!-- Hero Bans Section -->
      <div class="hero-bans-section" id="hero-bans-section" style="opacity: 0;">
        <!-- Home Ban Panel -->
        <div class="hero-panel" id="home-panel">
          <div class="hero-panel__art" id="home-panel-art">
            <span class="hero-panel__tag" id="home-panel-tag">1ST BAN</span>
            <div class="hero-panel__extra" id="home-panel-extra"></div>
          </div>
          <div class="hero-panel__band">
            <span class="hero-panel__name" id="home-panel-name">-</span>
          </div>
        </div>

        <!-- Away Ban Panel -->
        <div class="hero-panel" id="away-panel">
          <div class="hero-panel__art" id="away-panel-art">
            <span class="hero-panel__tag" id="away-panel-tag">2ND BAN</span>
            <div class="hero-panel__extra" id="away-panel-extra"></div>
          </div>
          <div class="hero-panel__band">
            <span class="hero-panel__name" id="away-panel-name">-</span>
          </div>
        </div>
      </div>

      <!-- Map Strip -->
      <div class="map-strip" id="map-strip" style="opacity: 0;">
        <div class="map-strip__mode">
          <div class="map-strip__mode-icon" id="map-mode-icon"></div>
          <span class="map-strip__mode-text" id="map-mode">MODE</span>
        </div>
        <span class="map-strip__index" id="map-index">MAP 1</span>
        <span class="map-strip__name" id="map-name">MAP NAME</span>
      </div>
    </div>
  </div>

  <script>
    // Shrink text until it fits on one line, then ellipsize at the floor size.
    function fitText(target, maxSize, minSize) {
      if (!target) return;
      target.style.whiteSpace = 'nowrap';
      target.style.overflow = 'hidden';
      target.style.textOverflow = 'ellipsis';

      const style = getComputedStyle(target);
      const available = target.clientWidth
        - parseFloat(style.paddingLeft)
        - parseFloat(style.paddingRight);
      if (!(available > 0)) return;

      // Ancestors animate with a transform, so convert the measured range
      // back into layout pixels before comparing it with the layout width.
      const measure = () => {
        const range = document.createRange();
        range.selectNodeContents(target);
        const scale = target.offsetWidth
          ? target.getBoundingClientRect().width / target.offsetWidth
          : 1;
        return scale > 0 ? range.getBoundingClientRect().width / scale : 0;
      };

      let size = maxSize;
      target.style.fontSize = `${size}px`;
      while (size > minSize && measure() > available) {
        size -= 1;
        target.style.fontSize = `${size}px`;
      }
    }

    function fitHeroBanText() {
      fitText(el.homeName, 36, 20);
      fitText(el.awayName, 36, 20);
      fitText(el.homePanelName, 36, 20);
      fitText(el.awayPanelName, 36, 20);
      fitText(el.mapName, 36, 18);
    }

    // Calculate contrast color (black or white) based on background luminance
    function getContrastColor(hexColor) {
      // Remove # if present
      const hex = hexColor.replace('#', '');
      // Parse RGB values
      const r = parseInt(hex.substr(0, 2), 16);
      const g = parseInt(hex.substr(2, 2), 16);
      const b = parseInt(hex.substr(4, 2), 16);
      // Calculate luminance
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      // Return the inverse surface for light colors, the surface for dark colors
      return luminance > 0.5 ? '#0b0d12' : '#eef2f8';
    }

    const el = {
      header: document.getElementById('header'),
      heroBansSection: document.getElementById('hero-bans-section'),
      mapStrip: document.getElementById('map-strip'),
      homeSection: document.getElementById('home-section'),
      homeLogo: document.getElementById('home-logo'),
      homeName: document.getElementById('home-name'),
      homeScore: document.getElementById('home-score'),
      homePanelArt: document.getElementById('home-panel-art'),
      homePanelTag: document.getElementById('home-panel-tag'),
      homePanelExtra: document.getElementById('home-panel-extra'),
      homePanelName: document.getElementById('home-panel-name'),
      awaySection: document.getElementById('away-section'),
      awayLogo: document.getElementById('away-logo'),
      awayName: document.getElementById('away-name'),
      awayScore: document.getElementById('away-score'),
      awayPanelArt: document.getElementById('away-panel-art'),
      awayPanelTag: document.getElementById('away-panel-tag'),
      awayPanelExtra: document.getElementById('away-panel-extra'),
      awayPanelName: document.getElementById('away-panel-name'),
      firstToText: document.getElementById('first-to-text'),
      mapMode: document.getElementById('map-mode'),
      mapModeIcon: document.getElementById('map-mode-icon'),
      mapIndex: document.getElementById('map-index'),
      mapName: document.getElementById('map-name')
    };

    let heroPortraits = {};
    let currentMapIndex = 0;
    let firstBanTeam = null;
    let teamColorsEnabled = false;
    let animationsTriggered = false;

    function triggerAnimations() {
      el.header.style.animation = 'fadeSlideDown 1.2s cubic-bezier(0.3, 1, 0.4, 1) 0.8s both';

      setTimeout(() => {
        el.heroBansSection.style.animation = 'fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both';
      }, 1200);

      setTimeout(() => {
        el.mapStrip.style.animation = 'fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both';
      }, 1500);
    }

    // Renders one ban panel. The first ban fills the art, and any further bans
    // for the same team become small portraits beside the ordinal tag, so the
    // two-panel layout never drops a ban.
    function renderBanPanel(art, extra, name, bans) {
      art.querySelectorAll('img').forEach((image) => image.remove());
      extra.innerHTML = '';

      const heroName = bans[0] || '';
      name.textContent = heroName || '-';
      if (!heroName) return;

      const portraitUrl = heroPortraits[heroName];
      if (portraitUrl) {
        const img = document.createElement('img');
        img.src = portraitUrl;
        img.loading = 'lazy';
        img.alt = heroName;
        art.insertBefore(img, art.firstChild);
      }

      bans.slice(1).forEach((extraName) => {
        const extraUrl = heroPortraits[extraName];
        if (!extraUrl) return;
        const img = document.createElement('img');
        img.src = extraUrl;
        img.loading = 'lazy';
        img.alt = extraName;
        img.title = extraName;
        extra.appendChild(img);
      });
    }

    function updateHeroBans(teamABans, teamBBans) {
      renderBanPanel(el.homePanelArt, el.homePanelExtra, el.homePanelName, teamABans);
      renderBanPanel(el.awayPanelArt, el.awayPanelExtra, el.awayPanelName, teamBBans);
    }

    function updateBanOrder(firstBan) {
      // The team that banned first carries the 1ST BAN tag, the other one
      // carries 2ND BAN.
      if (firstBan === 'B') {
        el.homePanelTag.textContent = '2ND BAN';
        el.awayPanelTag.textContent = '1ST BAN';
      } else {
        el.homePanelTag.textContent = '1ST BAN';
        el.awayPanelTag.textContent = '2ND BAN';
      }
    }

    function connect() {
      // Reach the server that served this page so a LAN or proxied client does
      // not dial its own localhost. ?host= and ?port= still override the target
      // for third-party pages.
      const query = new URLSearchParams(location.search);
      const host = query.get('host');
      const port = query.get('port');
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      const target = host || port
        ? `${host || 'localhost'}:${port || '3001'}`
        : (location.host || 'localhost:3001');
      const ws = new WebSocket(`${scheme}://${target}`);

      ws.onmessage = ({ data }) => {
        try {
          updateOverlay(JSON.parse(data));
        } catch (e) {
          console.error('Parse error:', e);
        }
      };

      ws.onclose = () => setTimeout(connect, 2000);
      ws.onerror = (e) => console.error('WS error:', e);
    }

    // === OVERLAY THEME ===
    // The app sends the active theme as a 	heme message. Its 	okens are
    // the complete set of CSS custom properties to override, so a property
    // applied by an earlier theme and missing from this set is removed again.
    // That is what restores the stylesheet defaults when the theme changes.
    let appliedThemeTokens = [];

    function applyTheme(payload) {
      const tokens =
        payload && typeof payload === 'object' && payload.tokens && typeof payload.tokens === 'object'
          ? payload.tokens
          : {};
      const root = document.documentElement;
      appliedThemeTokens.forEach((name) => {
        if (!Object.prototype.hasOwnProperty.call(tokens, name)) root.style.removeProperty(name);
      });
      appliedThemeTokens = Object.keys(tokens);
      appliedThemeTokens.forEach((name) => {
        root.style.setProperty(name, String(tokens[name]));
      });
    }
    function updateOverlay(data) {
      const d = data.data || data;
      if (data.type === 'theme') {
        applyTheme(d);
        return;
      }
      if (data.type === 'init' && d.theme) {
        applyTheme(d.theme);
      }


      if (data.type === 'init' && d.scoreboard) {
        return updateOverlay({ type: 'heroBans', data: d.scoreboard });
      }

      if (data.type === 'scoreboard' || data.type === 'gameOverlay' || data.type === 'heroBans') {
        // Team colors
        if (d.teamColorsEnabled !== undefined) {
          teamColorsEnabled = d.teamColorsEnabled;
        }

        // Team data
        if (d.teamA) {
          if (d.teamA.logoUrl) {
            el.homeLogo.style.backgroundImage = `url(${d.teamA.logoUrl})`;
          }
          el.homeName.textContent = d.teamA.name || 'HOME TEAM';
          el.homeScore.textContent = d.scoreA || 0;
          if (teamColorsEnabled && d.teamA.color) {
            el.homeSection.style.backgroundColor = d.teamA.color;
            el.homeName.style.color = getContrastColor(d.teamA.color);
          } else {
            el.homeSection.style.backgroundColor = 'var(--fgc-surface)';
            el.homeName.style.color = '';
          }
        }

        if (d.teamB) {
          if (d.teamB.logoUrl) {
            el.awayLogo.style.backgroundImage = `url(${d.teamB.logoUrl})`;
          }
          el.awayName.textContent = d.teamB.name || 'AWAY TEAM';
          el.awayScore.textContent = d.scoreB || 0;
          if (teamColorsEnabled && d.teamB.color) {
            el.awaySection.style.backgroundColor = d.teamB.color;
            el.awayName.style.color = getContrastColor(d.teamB.color);
          } else {
            el.awaySection.style.backgroundColor = 'var(--fgc-surface)';
            el.awayName.style.color = '';
          }
        }

        // First to
        if (d.firstTo) {
          el.firstToText.textContent = `FIRST TO ${d.firstTo}`;
        }

        // Current map index, used for the ban slots and the map strip.
        if (d.currentMapIndex !== undefined && d.currentMapIndex !== null) {
          currentMapIndex = d.currentMapIndex;
        }

        // Hero bans
        if (d.heroBans && Array.isArray(d.heroBans)) {
          const currentMapBans = d.heroBans[currentMapIndex] || { firstBanTeam: null, teamA: [], teamB: [] };
          firstBanTeam = currentMapBans.firstBanTeam;
          updateHeroBans(currentMapBans.teamA, currentMapBans.teamB);
          updateBanOrder(firstBanTeam);
        }

        // Hero portraits
        if (d.heroPortraits) {
          heroPortraits = d.heroPortraits;
          // Re-render bans if we already have data
          if (d.heroBans) {
            const currentMapBans = d.heroBans[currentMapIndex] || { teamA: [], teamB: [] };
            updateHeroBans(currentMapBans.teamA, currentMapBans.teamB);
          }
        }

        // Map strip: the mode and the map name sit in the bottom strip, never
        // over the hero art.
        el.mapIndex.textContent = `MAP ${currentMapIndex + 1}`;
        el.mapName.textContent = d.currentMap || 'TBD';
        const modeName = d.mapType || '';
        el.mapMode.textContent = modeName.toUpperCase();
        // The icon map is keyed by the lower-case mode name, while the match
        // stores the mode as it was typed.
        const modeIcon = modeName ? (d.gameModeIcons || {})[modeName.toLowerCase()] : null;
        el.mapModeIcon.style.backgroundImage = modeIcon ? `url(${modeIcon})` : '';

        document.fonts.ready.then(fitHeroBanText);

        if (!animationsTriggered) {
          triggerAnimations();
          animationsTriggered = true;
        } else {
          el.header.style.opacity = '1';
          el.heroBansSection.style.opacity = '1';
          el.mapStrip.style.opacity = '1';
        }
      }

      if (data.type === 'show') {
        document.querySelector('.overlay').style.display = data.visible ? 'block' : 'none';
      }
    }

    document.fonts.ready.then(fitHeroBanText);
    connect();
  </script>
</body>
</html>
