<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920">
  <link rel="icon" href="data:,">
  <title>Team Roster - Home</title>
  <style>
    /* Critical document guard: contain overscanned FX/lattice layers during load so transient scrollbars never appear. */
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    @font-face {
      font-family: 'FGC Display Light';
      font-weight: 300;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-300.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display';
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-400.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display Medium';
      font-weight: 500;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-500.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display SemiBold';
      font-weight: 600;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-600.woff2') format('woff2');
    }

    @font-face {
      font-family: 'FGC Display Black';
      font-weight: 900;
      font-style: normal;
      font-display: swap;
      src: url('/assets/fonts/archivo-900.woff2') format('woff2');
    }

    /* === NIGHT BROADCAST TOKENS ===
       Shared design tokens for the Fruiterra overlay refresh. Each overlay
       inlines this block, exactly as it inlines its own font faces. */
    :root {
      --fgc-canvas: transparent;

      --fgc-surface: #0b0d12;
      --fgc-surface-raised: #11151d;
      --fgc-surface-inverse: #eef2f8;
      --fgc-surface-muted: #151922;

      --fgc-line: #2a3140;
      --fgc-line-strong: #3a4356;
      --fgc-line-on-inverse: #0b0d12;

      --fgc-text: #eef2f8;
      --fgc-text-muted: #8d99ad;
      --fgc-text-faint: #6b7688;
      --fgc-text-inverse: #0b0d12;

      --fgc-accent: #ff7a1a;
      --fgc-accent-strong: #ff9346;
      --fgc-accent-soft: rgb(255 122 26 / 16%);
      --fgc-on-accent: #0b0d12;

      --fgc-success: #3ecf8e;
      --fgc-warning: #f5b84b;
      --fgc-danger: #ef5b5b;

      --fgc-space-1: 4px;
      --fgc-space-2: 8px;
      --fgc-space-3: 12px;
      --fgc-space-4: 16px;
      --fgc-radius-sm: 4px;
      --fgc-radius-md: 6px;
      --fgc-radius-lg: 10px;
      --fgc-radius-pill: 999px;
      --fgc-margin: 43px;

      --fgc-duration-micro: 120ms;
      --fgc-duration-state: 240ms;
      --fgc-duration-reveal: 480ms;
      --fgc-duration-scene: 900ms;
      --fgc-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'FGC Display', 'Apotek', sans-serif;
      background: transparent;
    }

    .overlay {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    .overlay {
      --fgc-team: var(--fgc-accent);
      --fgc-wash: rgb(255 122 26 / 16%);
      --fgc-glow: rgb(255 122 26 / 20%);
      --fgc-hex-cell: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }

    /* === ANIMATIONS === */
    @keyframes fadeSlideDown {
      from {
        opacity: 0;
        transform: translateY(-50px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .main-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      padding: 100px 200px;
      row-gap: 25px;
    }

    .roster-wash {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 760px;
      z-index: 0;
      pointer-events: none;
    }

    .roster-wash::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -120px;
      height: 320px;
      filter: blur(14px);
    }

    .overlay[data-roster-side="home"] .roster-wash {
      left: 0;
      background: linear-gradient(90deg, var(--fgc-wash), transparent 82%);
    }

    .overlay[data-roster-side="home"] .roster-wash::after {
      background: radial-gradient(58% 100% at 22% 100%, var(--fgc-glow), transparent 72%);
    }

    .overlay[data-roster-side="away"] .roster-wash {
      right: 0;
      background: linear-gradient(270deg, var(--fgc-wash), transparent 82%);
    }

    .overlay[data-roster-side="away"] .roster-wash::after {
      background: radial-gradient(58% 100% at 78% 100%, var(--fgc-glow), transparent 72%);
    }

    .roster-separator {
      width: 1500px;
      height: 20px;
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .roster-separator::before,
    .roster-separator::after {
      content: '';
      position: absolute;
      top: 50%;
      width: calc(50% - 32px);
      height: 1px;
      background: var(--fgc-line);
      transform: translateY(-50%);
    }

    .roster-separator::before { left: 0; }
    .roster-separator::after { right: 0; }

    .roster-separator__hex {
      width: 18px;
      height: 20px;
      background: var(--fgc-line-strong);
      clip-path: var(--fgc-hex-cell);
    }

    /* === TEAM HEADER === */
    .team-header {
      width: 1500px;
      height: 92px;
      background: var(--fgc-surface);
      border-radius: 6px;
      display: flex;
      align-items: center;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      clip-path: inset(0 round 6px);
    }

    .team-logo {
      width: 100px;
      height: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: var(--fgc-surface-inverse);
      flex-shrink: 0;
    }

    .team-name {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      padding: 0 24px;
      font-family: 'FGC Display Black', 'Apotek Black', sans-serif;
      font-size: 72px;
      line-height: 92px;
      color: var(--fgc-text);
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      z-index: 1;
    }

    /* === CORE PLAYERS === */
    .core-stage {
      width: 1500px;
      height: 600px;
      position: relative;
      flex-shrink: 0;
    }

    .core-players {
      width: 100%;
      height: 100%;
      display: flex;
      gap: 20px;
    }

    .core-rail {
      position: absolute;
      top: 40px;
      bottom: 40px;
      width: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .core-rail::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: var(--fgc-line);
      transform: translateX(-50%);
    }

    .core-rail--left { left: -92px; }
    .core-rail--right { right: -92px; }

    .core-rail__hex {
      position: relative;
      width: 18px;
      height: 20px;
      background: var(--fgc-line-strong);
      clip-path: var(--fgc-hex-cell);
    }

    /* === SUBSTITUTES === */
    .substitutes {
      width: 1500px;
      height: 76px;
      display: flex;
      gap: 20px;
      justify-content: flex-end;
    }

    /* === PLAYER CARD (CORE) === */
    .player-card-core {
      /* The core roster shares the row evenly. The cards flex to fill the
         roster width instead of holding a fixed 284px, so a short or long
         roster always spans the same columns. Substitutes keep a fixed
         width because they are a separate, right-aligned strip. */
      flex: 1 1 0;
      min-width: 0;
      height: 600px;
      background: var(--fgc-surface-raised);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      clip-path: inset(0 round 6px);
    }

    .player-card-core .role-badge {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: 56px;
      height: 56px;
      background: var(--fgc-surface);
      clip-path: var(--fgc-hex-cell);
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-card-core .role-badge:empty {
      display: none;
    }

    .player-card-core .role-badge img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .player-card-core .hero-image {
      position: relative;
      width: 100%;
      flex: 1;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 6px 6px 0 0;
    }

    .player-card-core .player-info {
      height: 126px;
      padding: 20px 24px;
      box-sizing: border-box;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      overflow: hidden;
    }

    .player-card-core .player-name {
      width: 100%;
      font-family: 'FGC Display Medium', 'Apotek Medium', sans-serif;
      font-size: 36px;
      line-height: 42px;
      color: var(--fgc-text);
      text-transform: uppercase;
      text-align: center;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .player-card-core .player-pronouns {
      font-family: 'FGC Display Light', 'Apotek Light', sans-serif;
      font-size: 18px;
      line-height: 22px;
      color: var(--fgc-text-muted);
      text-transform: uppercase;
      text-align: center;
    }

    /* === PLAYER CARD (SUBSTITUTE) === */
    .player-card-sub {
      width: 284px;
      height: 100%;
      background: var(--fgc-surface-raised);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
      position: relative;
      clip-path: inset(0 round 6px);
    }

    .player-card-sub .sub-portrait {
      position: relative;
      width: 72px;
      height: 100%;
      background: var(--fgc-surface-muted);
      flex-shrink: 0;
    }

    .player-card-sub .role-badge {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      width: 58px;
      height: 58px;
      background: var(--fgc-surface);
      clip-path: var(--fgc-hex-cell);
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-card-sub .role-badge:empty {
      display: none;
    }

    .player-card-sub .role-badge img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .player-card-sub .player-info {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 8px 20px 8px 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      overflow: hidden;
    }

    .player-card-sub .player-name {
      width: 100%;
      font-family: 'FGC Display Medium', 'Apotek Medium', sans-serif;
      font-size: 24px;
      line-height: 26px;
      color: var(--fgc-text);
      text-transform: uppercase;
      text-align: center;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .player-card-sub .player-pronouns {
      font-family: 'FGC Display Light', 'Apotek Light', sans-serif;
      font-size: 14px;
      line-height: 16px;
      color: var(--fgc-text-muted);
      text-transform: uppercase;
      text-align: center;
    }

    /* === ICON VISIBILITY === */
    .icon-hidden {
      display: none !important;
    }
  </style>
  <!-- === FGC CANONICAL FX START === -->
  <style>
    :root {
      --fgc-hex-mask: url("data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' width='56' height='100' viewBox='0 0 56 100'%3E%3Cpath d='M28 66L0 50L0 16L28 0L56 16L56 50L28 66L28 100L0 84L0 50L28 34L56 50L56 84L28 100' fill='none' stroke='%23ffffff' stroke-width='1'/%3E%3C/svg%3E");
    }

    /* The mask repeats every 180x322 px, so exactly one tile of travel lands
       on an identical frame. Keeping the colour uniform is part of that seam:
       a non-repeating gradient would move even though the lattice re-aligned. */
    @keyframes fgcCanonicalFxDrift {
      from { transform: translate3d(0, -322px, 0); }
      to { transform: translate3d(180px, 0, 0); }
    }

    /* The FX siblings come first; the existing roots stay above them without
       changing their geometry, colours or layout. */
    .overlay {
      z-index: 1;
    }

    /* Opaque mode is one plain plate taken from the theme. The lattice stays
       on top of it, so both modes carry the hexagon display. */
    .fgc-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      display: none;
      background-color: var(--fgc-surface);
    }

    .fgc-fx {
      position: absolute;
      /* More than one tile on every side, including the travel at both ends. */
      inset: -360px;
      z-index: 0;
      pointer-events: none;
      background-color: var(--fgc-line-strong);
      opacity: 0.16;
      -webkit-mask-image: var(--fgc-hex-mask);
      mask-image: var(--fgc-hex-mask);
      -webkit-mask-size: 180px 322px;
      mask-size: 180px 322px;
      -webkit-mask-repeat: repeat;
      mask-repeat: repeat;
      -webkit-mask-position: center;
      mask-position: center;
      transform: translate3d(0, -322px, 0);
      animation: fgcCanonicalFxDrift 72s linear infinite;
      /* Only this compositor drift changes every frame; the mask never repaints. */
      will-change: transform;
    }

    html[data-fx="off"] .fgc-fx {
      display: none;
    }

    html[data-bg="opaque"] .fgc-bg {
      display: block;
    }


    /* Reduced motion freezes the drift but keeps the static lattice. */
    @media (prefers-reduced-motion: reduce) {
      .fgc-fx {
        animation: none;
      }
    }
  </style>
  <script>
    (() => {
      const query = new URLSearchParams(location.search);
      const root = document.documentElement;

      const requestedFx = query.get('fx');
      if (requestedFx === 'on' || requestedFx === 'off') {
        root.dataset.fx = requestedFx;
      } else if (root.dataset.fx !== 'off') {
        root.dataset.fx = 'on';
      }

      // Opaque turns transparency off; transparent turns it back on. The
      // short aliases read naturally in a Browser Source URL. A document-level
      // data-bg attribute lets a host page choose the default.
      const requestedBg = query.get('bg');
      const bgMode =
        requestedBg === 'off' ? 'opaque' :
        requestedBg === 'on' ? 'transparent' :
        requestedBg;
      if (bgMode === 'opaque' || bgMode === 'transparent') {
        root.dataset.bg = bgMode;
      } else if (root.dataset.bg !== 'opaque') {
        root.dataset.bg = 'transparent';
      }

      // A cached section message lets the app switch every connected source
      // without an OBS refresh. It also arrives inside the keyed init frame
      // when a source refreshes, so the URL is only the starting state.
      window.fgcUpdateBackground = (data) => {
        const payload = data && typeof data === 'object' ? (data.data || data) : null;
        const section = payload && payload.background && typeof payload.background === 'object'
          ? payload.background
          : null;
        const candidate = section || payload;
        const opaque = candidate && typeof candidate.opaque === 'boolean' ? candidate.opaque : null;
        if (opaque !== null) {
          root.dataset.bg = opaque ? 'opaque' : 'transparent';
        }
      };
    })();
  </script>
  <!-- === FGC CANONICAL FX END === -->
</head>
<body>
  <div class="fgc-bg" aria-hidden="true"></div>
  <div class="fgc-fx" aria-hidden="true"></div>
  <div class="overlay">
    <div class="roster-wash" aria-hidden="true"></div>
    <div class="main-container">
      <!-- Team Header -->
      <div class="team-header" id="team-header" style="opacity: 0;">
        <div class="team-logo" id="team-logo"></div>
        <div class="team-name" id="team-name">TEAM NAME</div>
      </div>

      <!-- Core Players -->
      <div class="core-stage">
        <div class="core-rail core-rail--left" aria-hidden="true">
          <div class="core-rail__hex"></div>
        </div>
        <div class="core-players" id="core-players" style="opacity: 0;"></div>
        <div class="core-rail core-rail--right" aria-hidden="true">
          <div class="core-rail__hex"></div>
        </div>
      </div>

      <!-- Hexagon separator, outside the rectangular rows -->
      <div class="roster-separator" aria-hidden="true">
        <div class="roster-separator__hex"></div>
      </div>

      <!-- Substitutes -->
      <div class="substitutes" id="substitutes" style="opacity: 0;"></div>
    </div>
  </div>

  <script>
    // Escape user-supplied text before interpolating it into innerHTML.
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (character) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      })[character]);
    }

    // Shrink text until it fits on one line, then ellipsize at the floor size.
    function fitText(target, maxSize, minSize) {
      if (!target) return;
      target.style.whiteSpace = 'nowrap';
      target.style.overflow = 'hidden';
      target.style.textOverflow = 'ellipsis';

      const style = getComputedStyle(target);
      const available = target.clientWidth
        - parseFloat(style.paddingLeft)
        - parseFloat(style.paddingRight);
      if (!(available > 0)) return;

      // Ancestors animate with a transform, so convert the measured range
      // back into layout pixels before comparing it with the layout width.
      const measure = () => {
        const range = document.createRange();
        range.selectNodeContents(target);
        const scale = target.offsetWidth
          ? target.getBoundingClientRect().width / target.offsetWidth
          : 1;
        return scale > 0 ? range.getBoundingClientRect().width / scale : 0;
      };

      let size = maxSize;
      target.style.fontSize = `${size}px`;
      while (size > minSize && measure() > available) {
        size -= 1;
        target.style.fontSize = `${size}px`;
      }
    }

    function fitRosterText() {
      fitText(el.teamName, 72, 40);
      el.corePlayers.querySelectorAll('.player-name').forEach((name) => {
        fitText(name, 36, 18);
      });
      el.substitutes.querySelectorAll('.player-name').forEach((name) => {
        fitText(name, 24, 14);
      });
    }

    const TEAM_SIDE = 'A';

    const el = {
      teamHeader: document.getElementById('team-header'),
      teamLogo: document.getElementById('team-logo'),
      teamName: document.getElementById('team-name'),
      corePlayers: document.getElementById('core-players'),
      substitutes: document.getElementById('substitutes'),
      overlay: document.querySelector('.overlay')
    };

    el.overlay.dataset.rosterSide = TEAM_SIDE === 'A' ? 'home' : 'away';

    let roleIcons = {};
    let teamColorsEnabled = false;
    let showPlayerPortraits = true;
    let currentData = null;
    let animationsTriggered = false;

    function triggerAnimations() {
      el.teamHeader.style.animation = 'fadeSlideDown 1.2s cubic-bezier(0.3, 1, 0.4, 1) 0.8s both';

      setTimeout(() => {
        el.corePlayers.style.opacity = '1';
        const cards = el.corePlayers.querySelectorAll('.player-card-core');
        cards.forEach((card, i) => {
          const delay = i * 100;
          setTimeout(() => {
            card.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
            card.style.opacity = '1';
            card.style.transform = 'translateY(0)';
          }, delay);
        });
      }, 1200);

      setTimeout(() => {
        el.substitutes.style.opacity = '1';
        const cards = el.substitutes.querySelectorAll('.player-card-sub');
        cards.forEach((card, i) => {
          const delay = (cards.length - 1 - i) * 100;
          setTimeout(() => {
            card.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
            card.style.opacity = '1';
            card.style.transform = 'translateY(0)';
          }, delay);
        });
      }, 2200);
    }

    function getRoleIcon(roleName) {
      if (!roleName) return '';
      const normalizedRole = roleName.toLowerCase();
      const iconUrl = roleIcons[normalizedRole] || roleIcons[roleName];
      if (!iconUrl) return '';
      return `<img src="${iconUrl}" alt="${escapeHtml(roleName)}" />`;
    }

    function createCorePlayerCard(player, index) {
      const card = document.createElement('div');
      card.className = 'player-card-core';
      card.style.opacity = '0';
      card.style.transform = 'translateY(40px)';

      let heroImageUrl;
      if (showPlayerPortraits && player.portraitUrl) {
        heroImageUrl = player.portraitUrl;
      } else if (player.heroImageUrl) {
        heroImageUrl = player.heroImageUrl;
      } else {
        heroImageUrl = null;
      }
      const roleBadge = `<div class="role-badge">${getRoleIcon(player.role)}</div>`;
      const heroImageHtml = heroImageUrl
        ? `<div class="hero-image" style="background-image: url('${heroImageUrl}')">${roleBadge}</div>`
        : `<div class="hero-image" style="background-color: var(--fgc-surface-muted)">${roleBadge}</div>`;

      card.innerHTML = `
        ${heroImageHtml}
        <div class="player-info">
          <div class="player-name" title="${escapeHtml(player.name || 'PLAYER')}">${escapeHtml(player.name || 'PLAYER')}</div>
          <div class="player-pronouns">${escapeHtml(player.pronouns || '')}</div>
        </div>
      `;

      card.dataset.index = index;

      return card;
    }

    function createSubCard(player, index, totalSubs) {
      const card = document.createElement('div');
      card.className = 'player-card-sub';
      card.style.opacity = '0';
      card.style.transform = 'translateY(30px)';

      card.innerHTML = `
        <div class="sub-portrait">
          <div class="role-badge">${getRoleIcon(player.role)}</div>
        </div>
        <div class="player-info">
          <div class="player-name" title="${escapeHtml(player.name || 'PLAYER')}">${escapeHtml(player.name || 'PLAYER')}</div>
          <div class="player-pronouns">${escapeHtml(player.pronouns || '')}</div>
        </div>
      `;

      card.dataset.index = index;

      return card;
    }

    function updateRoster() {
      if (!currentData) return;

      const teamData = TEAM_SIDE === 'A' ? currentData.teamA : currentData.teamB;
      const players = TEAM_SIDE === 'A' ? (currentData.teamAPlayers || []) : (currentData.teamBPlayers || []);

      if (!teamData) {
        el.teamName.textContent = 'NO TEAM';
        el.corePlayers.innerHTML = '';
        el.substitutes.innerHTML = '';
        return;
      }

      // Update team header
      if (teamData.logoUrl) {
        el.teamLogo.style.backgroundImage = `url(${teamData.logoUrl})`;
        el.teamLogo.classList.remove('icon-hidden');
      } else {
        el.teamLogo.style.backgroundImage = '';
        el.teamLogo.classList.add('icon-hidden');
      }

      // Apply logo background color
      el.teamLogo.style.backgroundColor = teamData.logoBgColor || '#eef2f8';

      el.teamName.textContent = teamData.name || 'TEAM NAME';

      // Apply team color if enabled
      if (teamColorsEnabled && teamData.color) {
        el.overlay.style.setProperty('--fgc-team', teamData.color);
        el.teamHeader.style.backgroundColor = teamData.color;
        // Calculate text contrast color
        const hex = teamData.color.replace('#', '');
        const r = parseInt(hex.substr(0, 2), 16);
        const g = parseInt(hex.substr(2, 2), 16);
        const b = parseInt(hex.substr(4, 2), 16);
        const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        const textColor = luminance > 0.5 ? '#0b0d12' : '#eef2f8';
        el.teamName.style.color = textColor;
        el.overlay.style.setProperty('--fgc-wash', `rgba(${r}, ${g}, ${b}, 0.16)`);
        el.overlay.style.setProperty('--fgc-glow', `rgba(${r}, ${g}, ${b}, 0.22)`);
      } else {
        el.overlay.style.removeProperty('--fgc-team');
        el.overlay.style.removeProperty('--fgc-wash');
        el.overlay.style.removeProperty('--fgc-glow');
        el.teamHeader.style.backgroundColor = 'var(--fgc-surface)';
        el.teamName.style.color = 'var(--fgc-text)';
      }

      // Filter and populate core players
      const corePlayersList = players.filter(p => p && p.position === 'core');
      el.corePlayers.innerHTML = '';
      corePlayersList.forEach((player, index) => {
        const card = createCorePlayerCard(player, index);
        el.corePlayers.appendChild(card);
      });

      // Filter and populate substitutes
      const subs = players.filter(p => p && p.position === 'sub');
      el.substitutes.innerHTML = '';
      subs.forEach((player, index) => {
        const card = createSubCard(player, index, subs.length);
        el.substitutes.appendChild(card);
      });

      document.fonts.ready.then(fitRosterText);
    }

    function connect() {
      // Reach the server that served this page so a LAN or proxied client does
      // not dial its own localhost. ?host= and ?port= still override the target
      // for third-party pages.
      const query = new URLSearchParams(location.search);
      const host = query.get('host');
      const port = query.get('port');
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      const target = host || port
        ? `${host || 'localhost'}:${port || '3001'}`
        : (location.host || 'localhost:3001');
      const ws = new WebSocket(`${scheme}://${target}`);

      ws.onmessage = ({ data }) => {
        try {
          updateOverlay(JSON.parse(data));
        } catch (e) {
          console.error('Parse error:', e);
        }
      };

      ws.onclose = () => setTimeout(connect, 2000);
      ws.onerror = (e) => console.error('WS error:', e);
    }

    // === OVERLAY THEME ===
    // The app sends the active theme as a `theme` message. Its  `tokens` are
    // the complete set of CSS custom properties to override, so a property
    // applied by an earlier theme and missing from this set is removed again.
    // That is what restores the stylesheet defaults when the theme changes.
    let appliedThemeTokens = [];

    function applyTheme(payload) {
      const tokens =
        payload && typeof payload === 'object' && payload.tokens && typeof payload.tokens === 'object'
          ? payload.tokens
          : {};
      const root = document.documentElement;
      appliedThemeTokens.forEach((name) => {
        if (!Object.prototype.hasOwnProperty.call(tokens, name)) root.style.removeProperty(name);
      });
      appliedThemeTokens = Object.keys(tokens);
      appliedThemeTokens.forEach((name) => {
        root.style.setProperty(name, String(tokens[name]));
      });
    }
    function updateOverlay(data) {
      if (window.fgcUpdateBackground) window.fgcUpdateBackground(data);
      const d = data.data || data;
      if (data.type === 'theme') {
        applyTheme(d);
        return;
      }
      if (data.type === 'init' && d.theme) {
        applyTheme(d.theme);
      }


      // Handle init message
      if (data.type === 'init' && d.teamRoster) {
        return updateOverlay({ type: 'teamRoster', data: d.teamRoster });
      }

      // Store all incoming data
      if (data.type === 'scoreboard' || data.type === 'gameOverlay' || data.type === 'teamRoster') {
        currentData = d;

        // Update team colors
        if (d.teamColorsEnabled !== undefined) {
          teamColorsEnabled = d.teamColorsEnabled;
        }

        // Update role icons
        if (d.roleIcons) {
          roleIcons = d.roleIcons;
        }

        // Update player portrait setting
        if (d.showPlayerPortraits !== undefined) {
          showPlayerPortraits = d.showPlayerPortraits;
        }

        // Update roster display
        updateRoster();

        if (!animationsTriggered) {
          triggerAnimations();
          animationsTriggered = true;
        } else {
          el.teamHeader.style.opacity = '1';
          el.corePlayers.style.opacity = '1';
          el.substitutes.style.opacity = '1';
          const coreCards = el.corePlayers.querySelectorAll('.player-card-core');
          coreCards.forEach(card => {
            card.style.opacity = '1';
            card.style.transform = 'translateY(0)';
          });
          const subCards = el.substitutes.querySelectorAll('.player-card-sub');
          subCards.forEach(card => {
            card.style.opacity = '1';
            card.style.transform = 'translateY(0)';
          });
        }
      }

      // Handle show/hide
      if (data.type === 'show') {
        el.overlay.style.display = data.visible ? 'block' : 'none';
      }
    }

    document.fonts.ready.then(fitRosterText);
    connect();
  </script>
</body>
</html>
